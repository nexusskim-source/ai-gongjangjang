<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>pokebook — 포켓몬 도감</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <!-- Babel 버전 고정 (없으면 인라인 변환이 깨져 빈 화면이 됨) -->
  <script src="https://unpkg.com/@babel/standalone@7.23.5/babel.min.js"></script>
  <style>
    @keyframes floaty {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    .animate-floaty { animation: floaty 3s ease-in-out infinite; }

    @keyframes pop {
      from { opacity: 0; transform: scale(0.92) translateY(10px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }
    .animate-pop { animation: pop 0.22s ease-out; }

    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    .animate-fadeIn { animation: fadeIn 0.2s ease-out; }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .animate-spin-slow { animation: spin 0.9s linear infinite; }
  </style>
</head>
<body class="bg-slate-50">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect, useCallback, useRef } = React;

    // ========================================
    // 📦 설정 — API & 페이지 단위
    // ========================================
    const API = "https://pokeapi.co/api/v2";
    const PAGE_SIZE = 24;        // 한 번에 보여주는 카드 수
    const MAX_DEX = 10000;       // 일반 도감만 (특수폼 id>=10000 제외)

    // 타입 한글 라벨 · 배지 색 · 카드 그라데이션 매핑 (18타입 전체)
    const TYPE_MAP = {
      normal:   { ko: "노말",   color: "bg-gray-400",                   gradient: "from-gray-300 to-slate-400" },
      fire:     { ko: "불",     color: "bg-orange-500",                 gradient: "from-orange-400 to-red-500" },
      water:    { ko: "물",     color: "bg-blue-500",                   gradient: "from-sky-400 to-blue-600" },
      grass:    { ko: "풀",     color: "bg-green-500",                  gradient: "from-green-400 to-emerald-600" },
      electric: { ko: "전기",   color: "bg-yellow-400 text-yellow-900", gradient: "from-yellow-300 to-amber-500" },
      ice:      { ko: "얼음",   color: "bg-cyan-400",                   gradient: "from-cyan-300 to-sky-400" },
      fighting: { ko: "격투",   color: "bg-red-600",                    gradient: "from-red-500 to-orange-700" },
      poison:   { ko: "독",     color: "bg-fuchsia-600",                gradient: "from-fuchsia-500 to-purple-600" },
      ground:   { ko: "땅",     color: "bg-amber-600",                  gradient: "from-amber-500 to-yellow-700" },
      flying:   { ko: "비행",   color: "bg-indigo-400",                 gradient: "from-indigo-300 to-sky-400" },
      psychic:  { ko: "에스퍼", color: "bg-pink-500",                   gradient: "from-pink-400 to-rose-500" },
      bug:      { ko: "벌레",   color: "bg-lime-500",                   gradient: "from-lime-400 to-green-500" },
      rock:     { ko: "바위",   color: "bg-stone-500",                  gradient: "from-stone-400 to-amber-700" },
      ghost:    { ko: "고스트", color: "bg-purple-600",                 gradient: "from-purple-500 to-indigo-700" },
      dragon:   { ko: "드래곤", color: "bg-indigo-600",                 gradient: "from-indigo-500 to-purple-700" },
      dark:     { ko: "악",     color: "bg-neutral-700",                gradient: "from-neutral-600 to-slate-800" },
      steel:    { ko: "강철",   color: "bg-slate-500",                  gradient: "from-slate-400 to-gray-600" },
      fairy:    { ko: "페어리", color: "bg-pink-400",                   gradient: "from-pink-300 to-rose-400" },
    };
    const DEFAULT_TYPE = { color: "bg-gray-400", gradient: "from-gray-300 to-slate-400" };

    const typeKo = (en) => (TYPE_MAP[en] ? TYPE_MAP[en].ko : en);
    const typeColor = (en) => (TYPE_MAP[en] ? TYPE_MAP[en].color : DEFAULT_TYPE.color);
    const typeGradient = (en) => (TYPE_MAP[en] ? TYPE_MAP[en].gradient : DEFAULT_TYPE.gradient);

    // 종족값 한글 라벨
    const STAT_KO = {
      hp: "HP", attack: "공격", defense: "방어",
      "special-attack": "특수공격", "special-defense": "특수방어", speed: "스피드",
    };

    const dexLabel = (dex) => "No." + String(dex).padStart(4, "0").replace(/^0(\d{3})$/, "$1");

    // ========================================
    // 🔌 PokeAPI — 카드 상세 캐시 & fetch
    // ========================================
    // 이미 불러온 상세를 도감번호별로 캐시 (앱 수명 동안 유지 → 재요청 방지)
    const detailCache = new Map();

    async function fetchPokemonDetail(id) {
      if (detailCache.has(id)) return detailCache.get(id);

      const [basicRes, speciesRes] = await Promise.all([
        fetch(`${API}/pokemon/${id}`),
        fetch(`${API}/pokemon-species/${id}`),
      ]);
      if (!basicRes.ok) throw new Error(`pokemon/${id} ${basicRes.status}`);
      const data = await basicRes.json();

      // species 는 실패해도 기본 정보만으로 진행할 수 있도록 보호
      let species = null;
      if (speciesRes.ok) {
        try { species = await speciesRes.json(); } catch (e) { species = null; }
      }

      const nameEn = data.name;
      const types = (data.types || []).map((t) => t.type.name);

      const img =
        (data.sprites &&
          data.sprites.other &&
          data.sprites.other["official-artwork"] &&
          data.sprites.other["official-artwork"].front_default) ||
        (data.sprites && data.sprites.front_default) ||
        null;

      const stats = (data.stats || []).map((s) => ({
        name: s.stat.name,
        ko: STAT_KO[s.stat.name] || s.stat.name,
        value: s.base_stat,
      }));

      // 한글 이름
      let nameKo = nameEn;
      if (species && Array.isArray(species.names)) {
        const ko = species.names.find((n) => n.language.name === "ko");
        if (ko) nameKo = ko.name;
      }

      // 한글 설명 (없으면 영문 폴백) — 제어문자 정리
      let desc = "";
      if (species && Array.isArray(species.flavor_text_entries)) {
        const pick =
          species.flavor_text_entries.find((e) => e.language.name === "ko") ||
          species.flavor_text_entries.find((e) => e.language.name === "en");
        if (pick) desc = pick.flavor_text.replace(/[\n\f\r­]+/g, " ").replace(/\s+/g, " ").trim();
      }

      // 한글 분류
      let genus = "";
      if (species && Array.isArray(species.genera)) {
        const g = species.genera.find((x) => x.language.name === "ko");
        if (g) genus = g.genus;
      }

      const pokemon = {
        id: data.id,
        dex: data.id,
        nameKo,
        nameEn,
        types,
        img,
        desc,
        height: typeof data.height === "number" ? data.height / 10 : null, // m
        weight: typeof data.weight === "number" ? data.weight / 10 : null, // kg
        genus,
        stats,
        gradient: typeGradient(types[0]),
      };

      detailCache.set(id, pokemon);
      return pokemon;
    }

    // ========================================
    // 🎨 디자인 시스템 컴포넌트
    // ========================================
    function TypeBadge({ type, className = "" }) {
      return (
        <span
          className={`inline-block rounded-full px-3 py-1 text-xs font-bold text-white shadow-sm ${typeColor(type)} ${className}`}
        >
          {typeKo(type)}
        </span>
      );
    }

    // 이미지 + onError 대체 표시
    function PokeImage({ pokemon, className = "", emojiSize = "text-6xl" }) {
      const [failed, setFailed] = useState(false);
      if (failed || !pokemon.img) {
        return (
          <div className={`flex items-center justify-center ${className}`} aria-label="이미지 없음">
            <span className={emojiSize}>⚪</span>
          </div>
        );
      }
      return (
        <img
          src={pokemon.img}
          alt={pokemon.nameKo}
          loading="lazy"
          onError={() => setFailed(true)}
          className={`object-contain ${className}`}
          draggable={false}
        />
      );
    }

    function SearchInput({ value, onChange }) {
      return (
        <div className="w-full max-w-sm">
          <div className="relative">
            <span className="pointer-events-none absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">
              🔍
            </span>
            <input
              type="search"
              value={value}
              onChange={(e) => onChange(e.target.value)}
              placeholder="도감번호 · 영문이름으로 검색…"
              aria-label="포켓몬 검색"
              className="w-full rounded-full border border-slate-200 bg-white/90 py-3 pl-11 pr-4 text-sm text-slate-700 shadow-sm outline-none transition focus:border-rose-300 focus:ring-2 focus:ring-rose-200"
            />
          </div>
          <p className="mt-2 text-center text-xs text-white/80">
            한글 이름은 번호나 영문으로 찾으면 정확해요 ✨
          </p>
        </div>
      );
    }

    // 종족값 막대
    function StatBar({ stat }) {
      const pct = Math.min(100, Math.round((stat.value / 180) * 100));
      return (
        <div className="flex items-center gap-2">
          <span className="w-16 shrink-0 text-xs font-semibold text-slate-500">{stat.ko}</span>
          <span className="w-8 shrink-0 text-right text-xs font-bold text-slate-700">{stat.value}</span>
          <div className="h-2.5 flex-1 overflow-hidden rounded-full bg-slate-100">
            <div
              className="h-full rounded-full bg-gradient-to-r from-rose-400 to-pink-500 transition-all"
              style={{ width: pct + "%" }}
            />
          </div>
        </div>
      );
    }

    // ========================================
    // 🧩 도감 카드 (지연 로딩)
    // ========================================
    // entry: { id, nameEn } — 마운트 시 상세를 fetch
    function PokeCard({ entry, onSelect, onLoaded }) {
      const [pokemon, setPokemon] = useState(() => detailCache.get(entry.id) || null);
      const [failed, setFailed] = useState(false);

      useEffect(() => {
        let alive = true;
        if (pokemon) {
          onLoaded && onLoaded(pokemon);
          return;
        }
        (async () => {
          try {
            const data = await fetchPokemonDetail(entry.id);
            if (!alive) return;
            setPokemon(data);
            onLoaded && onLoaded(data);
          } catch (e) {
            if (!alive) return;
            setFailed(true);
          }
        })();
        return () => { alive = false; };
        // entry.id 가 바뀌면 다시 로딩 (검색/페이지 전환 시 키 재사용 대비)
      }, [entry.id]);

      // 로딩 중 스켈레톤
      if (!pokemon && !failed) {
        return <SkeletonCard />;
      }

      // 실패한 카드 — 그 카드만 ⚪ + 영문이름
      if (failed) {
        const fallback = {
          dex: entry.id,
          nameKo: entry.nameEn,
          nameEn: entry.nameEn,
          types: [],
          img: null,
          desc: "정보를 불러오지 못했어요.",
          gradient: DEFAULT_TYPE.gradient,
        };
        return (
          <div className="overflow-hidden rounded-3xl bg-white text-left shadow-md ring-1 ring-slate-100 opacity-90">
            <div className={`relative bg-gradient-to-br ${fallback.gradient} p-5`}>
              <span className="absolute right-3 top-3 rounded-full bg-white/30 px-3 py-1 text-xs font-extrabold text-white backdrop-blur-sm">
                {dexLabel(fallback.dex)}
              </span>
              <div className="flex h-40 items-center justify-center">
                <span className="text-6xl">⚪</span>
              </div>
            </div>
            <div className="p-5">
              <h3 className="text-xl font-extrabold capitalize text-slate-800">{fallback.nameEn}</h3>
              <p className="mt-3 text-sm text-slate-400">{fallback.desc}</p>
            </div>
          </div>
        );
      }

      return (
        <button
          onClick={() => onSelect(pokemon)}
          aria-label={`${pokemon.nameKo} 상세 보기`}
          className="group relative overflow-hidden rounded-3xl bg-white text-left shadow-md ring-1 ring-slate-100 transition-all duration-300 hover:-translate-y-2 hover:shadow-2xl focus:outline-none focus:ring-4 focus:ring-rose-200"
        >
          {/* 그라데이션 배경 영역 */}
          <div className={`relative bg-gradient-to-br ${pokemon.gradient} p-5`}>
            <span className="absolute right-3 top-3 rounded-full bg-white/30 px-3 py-1 text-xs font-extrabold text-white backdrop-blur-sm">
              {dexLabel(pokemon.dex)}
            </span>
            <div className="flex h-40 items-center justify-center">
              <PokeImage
                pokemon={pokemon}
                className="h-36 w-36 drop-shadow-xl transition-transform duration-300 group-hover:scale-110 animate-floaty"
              />
            </div>
          </div>

          {/* 정보 영역 */}
          <div className="p-5">
            <div className="flex items-baseline gap-2">
              <h3 className="text-xl font-extrabold text-slate-800">{pokemon.nameKo}</h3>
              <span className="text-sm font-medium text-slate-400 capitalize">{pokemon.nameEn}</span>
            </div>
            <div className="mt-2 flex flex-wrap gap-1.5">
              {pokemon.types.map((t) => (
                <TypeBadge key={t} type={t} />
              ))}
            </div>
            <p className="mt-3 line-clamp-3 text-sm leading-relaxed text-slate-500">{pokemon.desc}</p>
          </div>
        </button>
      );
    }

    // 로딩 스켈레톤 카드
    function SkeletonCard() {
      return (
        <div className="overflow-hidden rounded-3xl bg-white shadow-md ring-1 ring-slate-100">
          <div className="flex h-40 animate-pulse items-center justify-center bg-slate-200">
            <span className="inline-block h-7 w-7 rounded-full border-4 border-white/60 border-t-rose-400 animate-spin-slow" />
          </div>
          <div className="space-y-3 p-5">
            <div className="h-5 w-1/2 animate-pulse rounded bg-slate-200" />
            <div className="h-4 w-1/3 animate-pulse rounded bg-slate-200" />
            <div className="h-3 w-full animate-pulse rounded bg-slate-100" />
            <div className="h-3 w-5/6 animate-pulse rounded bg-slate-100" />
          </div>
        </div>
      );
    }

    // ========================================
    // 🪟 상세 모달
    // ========================================
    function DetailModal({ pokemon, onClose }) {
      if (!pokemon) return null;
      return (
        <div
          className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 p-4 animate-fadeIn"
          onClick={onClose}
          role="dialog"
          aria-modal="true"
          aria-label={`${pokemon.nameKo} 상세 정보`}
        >
          <div
            className="animate-pop max-h-[90vh] w-full max-w-md overflow-y-auto rounded-3xl bg-white shadow-2xl"
            onClick={(e) => e.stopPropagation()}
          >
            <div className={`relative bg-gradient-to-br ${pokemon.gradient} p-6`}>
              <button
                onClick={onClose}
                aria-label="닫기"
                className="absolute right-4 top-4 flex h-9 w-9 items-center justify-center rounded-full bg-white/30 text-lg font-bold text-white backdrop-blur-sm transition hover:bg-white/50"
              >
                ✕
              </button>
              <span className="absolute left-6 top-5 rounded-full bg-white/30 px-3 py-1 text-xs font-extrabold text-white backdrop-blur-sm">
                {dexLabel(pokemon.dex)}
              </span>
              <div className="flex h-52 items-center justify-center">
                <PokeImage
                  pokemon={pokemon}
                  className="h-48 w-48 drop-shadow-2xl animate-floaty"
                  emojiSize="text-8xl"
                />
              </div>
            </div>

            <div className="p-6">
              <div className="flex items-baseline gap-2">
                <h2 className="text-3xl font-extrabold text-slate-800">{pokemon.nameKo}</h2>
                <span className="text-base font-medium text-slate-400 capitalize">{pokemon.nameEn}</span>
              </div>
              {pokemon.genus && (
                <p className="mt-1 text-sm font-semibold text-rose-400">{pokemon.genus}</p>
              )}

              <div className="mt-3 flex flex-wrap gap-2">
                {pokemon.types.map((t) => (
                  <TypeBadge key={t} type={t} className="px-4 py-1.5 text-sm" />
                ))}
              </div>

              {pokemon.desc && (
                <p className="mt-4 text-base leading-relaxed text-slate-600">{pokemon.desc}</p>
              )}

              <dl className="mt-5 grid grid-cols-2 gap-3 rounded-2xl bg-slate-50 p-4 text-sm">
                <div>
                  <dt className="text-slate-400">도감번호</dt>
                  <dd className="font-bold text-slate-700">{dexLabel(pokemon.dex)}</dd>
                </div>
                <div>
                  <dt className="text-slate-400">타입</dt>
                  <dd className="font-bold text-slate-700">
                    {pokemon.types.map((t) => typeKo(t)).join(" / ") || "—"}
                  </dd>
                </div>
                <div>
                  <dt className="text-slate-400">키</dt>
                  <dd className="font-bold text-slate-700">
                    {pokemon.height != null ? `${pokemon.height} m` : "—"}
                  </dd>
                </div>
                <div>
                  <dt className="text-slate-400">몸무게</dt>
                  <dd className="font-bold text-slate-700">
                    {pokemon.weight != null ? `${pokemon.weight} kg` : "—"}
                  </dd>
                </div>
              </dl>

              {pokemon.stats && pokemon.stats.length > 0 && (
                <div className="mt-5">
                  <h3 className="mb-2 text-sm font-bold text-slate-500">종족값</h3>
                  <div className="space-y-2">
                    {pokemon.stats.map((s) => (
                      <StatBar key={s.name} stat={s} />
                    ))}
                  </div>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    // ========================================
    // ⏳ 로딩 / ❌ 에러 화면 (첫 목록)
    // ========================================
    function LoadingScreen() {
      return (
        <div>
          <div className="mb-8 flex items-center justify-center gap-3 text-slate-500">
            <span className="inline-block h-6 w-6 rounded-full border-4 border-slate-200 border-t-rose-400 animate-spin-slow" />
            <span className="text-sm font-semibold">도감을 불러오는 중…</span>
          </div>
          <div className="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3">
            {Array.from({ length: 6 }).map((_, i) => (
              <SkeletonCard key={i} />
            ))}
          </div>
        </div>
      );
    }

    function ErrorBox({ onRetry }) {
      return (
        <div className="mx-auto flex max-w-md flex-col items-center justify-center rounded-3xl bg-white px-6 py-12 text-center shadow-md ring-1 ring-slate-100">
          <span className="text-6xl">😵</span>
          <p className="mt-4 text-lg font-bold text-slate-700">도감을 불러오지 못했어요.</p>
          <p className="mt-1 text-sm text-slate-400">네트워크를 확인하고 다시 시도해 주세요.</p>
          <button
            onClick={onRetry}
            className="mt-6 rounded-full bg-gradient-to-r from-rose-400 to-pink-500 px-6 py-2.5 text-sm font-bold text-white shadow-md transition hover:shadow-lg focus:outline-none focus:ring-4 focus:ring-rose-200"
          >
            🔄 다시 시도
          </button>
        </div>
      );
    }

    // ========================================
    // 🚀 App
    // ========================================
    function App() {
      const [query, setQuery] = useState("");
      const [selected, setSelected] = useState(null);
      const [index, setIndex] = useState([]);     // 전체 인덱스 [{ id, nameEn }]
      const [count, setCount] = useState(0);       // data.count (전체 마리수)
      const [status, setStatus] = useState("loading"); // loading | done | error
      const [visible, setVisible] = useState(PAGE_SIZE); // 현재 보여줄 개수

      // 이미 한글 이름까지 로드된 카드 추적 (한글 부분검색용)
      const [loadedNames, setLoadedNames] = useState({}); // { id: nameKo }
      const handleLoaded = useCallback((p) => {
        setLoadedNames((prev) =>
          prev[p.id] === p.nameKo ? prev : { ...prev, [p.id]: p.nameKo }
        );
      }, []);

      // ── 전체 목록 1회 호출 ──
      const load = useCallback(async () => {
        setStatus("loading");
        try {
          const res = await fetch(`${API}/pokemon?limit=100000&offset=0`);
          if (!res.ok) throw new Error(`list ${res.status}`);
          const data = await res.json();

          const list = (data.results || [])
            .map((r) => {
              const m = r.url.match(/\/pokemon\/(\d+)\/?$/);
              const id = m ? Number(m[1]) : NaN;
              return { id, nameEn: r.name };
            })
            .filter((e) => Number.isFinite(e.id) && e.id <= MAX_DEX) // 특수폼 제외
            .sort((a, b) => a.id - b.id);

          if (list.length === 0) {
            setStatus("error");
            return;
          }
          setIndex(list);
          setCount(typeof data.count === "number" ? data.count : list.length);
          setStatus("done");
        } catch (e) {
          setStatus("error");
        }
      }, []);

      useEffect(() => { load(); }, [load]);

      // ── 검색 필터 (전체 인덱스 대상) ──
      const filtered = useMemo(() => {
        const q = query.trim().toLowerCase();
        if (!q) return index;

        // 숫자 → 도감번호 부분일치
        if (/^\d+$/.test(q)) {
          return index.filter((e) => String(e.id).includes(q));
        }

        // 한글 입력 → 이미 로드된 카드의 한글 이름에서 부분일치
        const hasHangul = /[ㄱ-ㅎㅏ-ㅣ가-힣]/.test(q);
        if (hasHangul) {
          return index.filter((e) => {
            const ko = loadedNames[e.id];
            return ko && ko.toLowerCase().includes(q);
          });
        }

        // 영문 → 영문 이름 부분일치
        return index.filter((e) => e.nameEn.toLowerCase().includes(q));
      }, [query, index, loadedNames]);

      // 검색어가 바뀌면 페이지 초기화
      useEffect(() => { setVisible(PAGE_SIZE); }, [query]);

      const shown = filtered.slice(0, visible);
      const hasMore = visible < filtered.length;

      // ── 무한 스크롤 (보조) + "더 보기" 버튼 ──
      const sentinelRef = useRef(null);
      useEffect(() => {
        if (status !== "done" || !hasMore) return;
        const el = sentinelRef.current;
        if (!el) return;
        const io = new IntersectionObserver(
          (entries) => {
            if (entries[0].isIntersecting) {
              setVisible((v) => Math.min(v + PAGE_SIZE, filtered.length));
            }
          },
          { rootMargin: "300px" }
        );
        io.observe(el);
        return () => io.disconnect();
      }, [status, hasMore, filtered.length]);

      return (
        <div className="min-h-screen">
          {/* 헤더 */}
          <header className="bg-gradient-to-r from-rose-400 via-pink-400 to-fuchsia-400 px-4 py-10 text-center text-white shadow-lg">
            <h1 className="text-4xl font-black tracking-tight drop-shadow-sm sm:text-5xl">
              <span className="mr-2">⚪</span>pokebook
            </h1>
            <p className="mt-2 text-sm text-white/90">
              {status === "done"
                ? `전국도감 전체 ${count.toLocaleString()}마리 — 카드를 눌러 자세히 보세요!`
                : "귀여운 포켓몬 도감 — 카드를 눌러 자세히 보세요!"}
            </p>
            <div className="mt-6 flex justify-center">
              <SearchInput value={query} onChange={setQuery} />
            </div>
          </header>

          {/* 본문 */}
          <main className="mx-auto max-w-6xl px-4 py-10">
            {status === "loading" ? (
              <LoadingScreen />
            ) : status === "error" ? (
              <ErrorBox onRetry={load} />
            ) : filtered.length === 0 ? (
              <div className="flex flex-col items-center justify-center py-20 text-center text-slate-400">
                <span className="text-6xl">🫥</span>
                <p className="mt-4 text-lg font-semibold">"{query}" 와 일치하는 포켓몬이 없어요.</p>
                <p className="mt-1 text-sm">
                  도감번호(예: 25)나 영문이름(예: pika)으로 검색해 보세요.
                </p>
              </div>
            ) : (
              <>
                {/* 현재 N / 전체 */}
                <div className="mb-6 text-center text-sm font-semibold text-slate-500">
                  {query.trim()
                    ? `검색 결과 ${filtered.length.toLocaleString()}마리 중 ${shown.length.toLocaleString()}마리`
                    : `${shown.length.toLocaleString()} / ${filtered.length.toLocaleString()}마리`}
                </div>

                <div className="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3">
                  {shown.map((entry) => (
                    <PokeCard
                      key={entry.id}
                      entry={entry}
                      onSelect={setSelected}
                      onLoaded={handleLoaded}
                    />
                  ))}
                </div>

                {/* 무한 스크롤 감지 + 더 보기 버튼 */}
                {hasMore && (
                  <div ref={sentinelRef} className="mt-10 flex justify-center">
                    <button
                      onClick={() => setVisible((v) => Math.min(v + PAGE_SIZE, filtered.length))}
                      className="rounded-full bg-gradient-to-r from-rose-400 to-pink-500 px-8 py-3 text-sm font-bold text-white shadow-md transition hover:-translate-y-0.5 hover:shadow-lg focus:outline-none focus:ring-4 focus:ring-rose-200"
                    >
                      더 보기 ＋
                    </button>
                  </div>
                )}
                {!hasMore && filtered.length > PAGE_SIZE && (
                  <p className="mt-10 text-center text-sm text-slate-400">— 끝까지 다 봤어요! —</p>
                )}
              </>
            )}
          </main>

          {/* 푸터 */}
          <footer className="pb-10 text-center text-xs text-slate-400">
            데이터: PokeAPI (pokeapi.co) · pokebook
          </footer>

          {/* 모달 */}
          <DetailModal pokemon={selected} onClose={() => setSelected(null)} />
        </div>
      );
    }

    // ========================================
    // ▶️ 렌더링
    // ========================================
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
