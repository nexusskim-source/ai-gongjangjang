<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>실시간 코인 시세 추적기</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- ⚠️ Babel standalone 버전 고정 필수 (7.23.5). 무버전/최신이면 빈 화면. -->
  <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.23.5/babel.min.js"></script>

  <style>
    /* 가격 갱신 시 부드러운 깜빡임 효과 (Tailwind로 표현하기 까다로운 keyframe) */
    @keyframes flashUpdate {
      0%   { background-color: rgba(56, 189, 248, 0.12); }
      100% { background-color: transparent; }
    }
    .flash-update {
      animation: flashUpdate 0.7s ease-out;
    }
    /* 스크롤바 살짝 다듬기 */
    body { background-color: #0b1120; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    // ========================================
    // React Hooks
    // ========================================
    const { useState, useEffect, useRef, useCallback } = React;

    // ========================================
    // 상수 / 설정
    // ========================================
    const COIN_IDS = ["bitcoin", "ethereum", "ripple", "solana", "dogecoin", "cardano", "tron", "chainlink"];
    const API_URL =
      "https://api.coingecko.com/api/v3/coins/markets?vs_currency=krw&ids=" +
      COIN_IDS.join(",") +
      "&order=market_cap_desc&price_change_percentage=24h";
    const REFRESH_INTERVAL_MS = 30000; // 30초

    // 영문 → 한글 이름 매핑
    const KO_NAMES = {
      bitcoin: "비트코인",
      ethereum: "이더리움",
      ripple: "리플",
      solana: "솔라나",
      dogecoin: "도지코인",
      cardano: "카르다노",
      tron: "트론",
      chainlink: "체인링크",
    };

    // ========================================
    // 유틸 함수
    // ========================================
    // 원화 콤마 표기
    function formatKRW(value) {
      if (value == null || isNaN(value)) return "-";
      const rounded = value >= 100 ? Math.round(value) : Math.round(value * 100) / 100;
      return rounded.toLocaleString("ko-KR") + "원";
    }

    // 한국식 축약 (조/억/만)
    function formatKoreanShort(value) {
      if (value == null || isNaN(value)) return "-";
      const units = [
        { v: 1e12, label: "조" },
        { v: 1e8, label: "억" },
        { v: 1e4, label: "만" },
      ];
      let remain = Math.floor(value);
      const parts = [];
      for (const u of units) {
        if (remain >= u.v) {
          const q = Math.floor(remain / u.v);
          parts.push(q.toLocaleString("ko-KR") + u.label);
          remain = remain % u.v;
        }
      }
      if (parts.length === 0) return remain.toLocaleString("ko-KR") + "원";
      return parts.join(" ") + "원";
    }

    function formatTime(date) {
      if (!date) return "-";
      const p = (n) => String(n).padStart(2, "0");
      return p(date.getHours()) + ":" + p(date.getMinutes()) + ":" + p(date.getSeconds());
    }

    // ========================================
    // 🎨 Design System Components
    // ========================================
    function Button({ children, onClick, variant = "primary", disabled = false, className = "" }) {
      const base =
        "inline-flex items-center justify-center gap-2 rounded-lg px-4 py-2 text-sm font-semibold transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-slate-900 disabled:opacity-50 disabled:cursor-not-allowed";
      const variants = {
        primary: "bg-sky-500 hover:bg-sky-400 text-white focus:ring-sky-400",
        secondary: "bg-slate-700 hover:bg-slate-600 text-slate-100 focus:ring-slate-500",
        danger: "bg-red-500 hover:bg-red-400 text-white focus:ring-red-400",
      };
      return (
        <button
          type="button"
          onClick={onClick}
          disabled={disabled}
          className={`${base} ${variants[variant]} ${className}`}
        >
          {children}
        </button>
      );
    }

    function Spinner({ className = "" }) {
      return (
        <svg
          className={`animate-spin h-4 w-4 ${className}`}
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4" />
          <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z" />
        </svg>
      );
    }

    // 자동 갱신 토글 스위치
    function Toggle({ checked, onChange, label }) {
      return (
        <label className="inline-flex items-center gap-2 cursor-pointer select-none">
          <span className="text-sm text-slate-300">{label}</span>
          <button
            type="button"
            role="switch"
            aria-checked={checked}
            onClick={() => onChange(!checked)}
            className={`relative inline-flex h-6 w-11 items-center rounded-full transition-colors ${
              checked ? "bg-emerald-500" : "bg-slate-600"
            }`}
          >
            <span
              className={`inline-block h-4 w-4 transform rounded-full bg-white transition-transform ${
                checked ? "translate-x-6" : "translate-x-1"
              }`}
            />
          </button>
        </label>
      );
    }

    // ========================================
    // 🧩 코인 카드
    // ========================================
    function CoinCard({ coin, flashKey }) {
      const change = coin.price_change_percentage_24h;
      const isUp = change != null && change >= 0;
      const changeColor = isUp ? "text-emerald-400" : "text-red-400";
      const arrow = isUp ? "▲" : "▼";
      const borderColor = isUp ? "border-emerald-500/40" : "border-red-500/40";
      const glow = isUp ? "shadow-emerald-500/10" : "shadow-red-500/10";

      return (
        <div
          key={flashKey}
          className={`flash-update rounded-2xl border ${borderColor} bg-slate-800/60 p-5 shadow-lg ${glow} backdrop-blur transition-transform hover:-translate-y-1`}
        >
          {/* 헤더: 로고 + 이름 + 심볼 */}
          <div className="flex items-center gap-3">
            <img
              src={coin.image}
              alt={coin.name}
              className="h-10 w-10 rounded-full bg-white/5"
              loading="lazy"
            />
            <div className="min-w-0">
              <div className="truncate text-base font-bold text-white">
                {KO_NAMES[coin.id] || coin.name}
              </div>
              <div className="text-xs text-slate-400">
                {coin.name} · <span className="font-semibold">{coin.symbol.toUpperCase()}</span>
              </div>
            </div>
          </div>

          {/* 현재가 */}
          <div className="mt-5">
            <div className="text-2xl font-extrabold tracking-tight text-white tabular-nums">
              {formatKRW(coin.current_price)}
            </div>
            <div className="mt-1 text-xs text-slate-400">
              시가총액 {formatKoreanShort(coin.market_cap)}
            </div>
          </div>

          {/* 24h 등락률 */}
          <div className="mt-4 flex items-center justify-between">
            <span className="text-xs text-slate-400">24시간 등락률</span>
            <span className={`text-sm font-bold tabular-nums ${changeColor}`}>
              {arrow} {change == null ? "-" : Math.abs(change).toFixed(1)}%
            </span>
          </div>
        </div>
      );
    }

    // ========================================
    // 🚨 에러 박스
    // ========================================
    function ErrorBox({ message, onRetry }) {
      return (
        <div className="rounded-xl border border-red-500/50 bg-red-950/40 p-5 text-center">
          <div className="text-2xl">⚠️</div>
          <p className="mt-2 font-semibold text-red-300">데이터를 불러오지 못했습니다</p>
          <p className="mt-1 text-sm text-red-400/80">{message}</p>
          <div className="mt-4">
            <Button variant="danger" onClick={onRetry}>
              다시 시도
            </Button>
          </div>
        </div>
      );
    }

    // ========================================
    // 🚀 App
    // ========================================
    function App() {
      const [coins, setCoins] = useState([]);
      const [loading, setLoading] = useState(true); // 첫 로딩
      const [refreshing, setRefreshing] = useState(false); // 갱신 중
      const [error, setError] = useState(null);
      const [lastUpdated, setLastUpdated] = useState(null);
      const [autoRefresh, setAutoRefresh] = useState(false);
      const [flashKey, setFlashKey] = useState(0); // 갱신 시 카드 깜빡임 트리거

      const isFetchingRef = useRef(false);

      const fetchCoins = useCallback(async (isInitial = false) => {
        if (isFetchingRef.current) return; // 중복 호출 방지
        isFetchingRef.current = true;
        if (isInitial) setLoading(true);
        else setRefreshing(true);

        try {
          const res = await fetch(API_URL, { headers: { accept: "application/json" } });
          if (!res.ok) {
            if (res.status === 429) {
              throw new Error("요청이 너무 많습니다 (429). 잠시 후 다시 시도해 주세요.");
            }
            throw new Error("서버 응답 오류 (HTTP " + res.status + ")");
          }
          const data = await res.json();
          if (!Array.isArray(data)) throw new Error("예상치 못한 응답 형식입니다.");

          // API ids 순서대로 정렬 (시총 순)
          setCoins(data);
          setError(null);
          setLastUpdated(new Date());
          setFlashKey((k) => k + 1);
        } catch (err) {
          setError(err.message || "알 수 없는 오류가 발생했습니다.");
        } finally {
          isFetchingRef.current = false;
          setLoading(false);
          setRefreshing(false);
        }
      }, []);

      // 첫 로딩
      useEffect(() => {
        fetchCoins(true);
      }, [fetchCoins]);

      // 자동 갱신 (setInterval + cleanup)
      useEffect(() => {
        if (!autoRefresh) return;
        const id = setInterval(() => {
          fetchCoins(false);
        }, REFRESH_INTERVAL_MS);
        return () => clearInterval(id);
      }, [autoRefresh, fetchCoins]);

      return (
        <div className="min-h-screen text-slate-100">
          <div className="mx-auto max-w-6xl px-4 py-8 sm:py-12">
            {/* 헤더 */}
            <header className="flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
              <div>
                <h1 className="text-2xl font-extrabold tracking-tight text-white sm:text-3xl">
                  💹 실시간 코인 시세 추적기
                </h1>
                <p className="mt-1 text-sm text-slate-400">
                  CoinGecko 공개 API · 원화(KRW) 기준
                </p>
              </div>

              <div className="flex flex-wrap items-center gap-3">
                <Toggle
                  checked={autoRefresh}
                  onChange={setAutoRefresh}
                  label="자동 갱신 (30초)"
                />
                <Button onClick={() => fetchCoins(false)} disabled={refreshing || loading}>
                  {refreshing ? <Spinner /> : <span aria-hidden="true">🔄</span>}
                  {refreshing ? "갱신 중..." : "새로고침"}
                </Button>
              </div>
            </header>

            {/* 상태 바 */}
            <div className="mt-4 flex flex-wrap items-center gap-x-4 gap-y-1 text-xs text-slate-400">
              <span className="inline-flex items-center gap-1">
                <span
                  className={`inline-block h-2 w-2 rounded-full ${
                    autoRefresh ? "bg-emerald-400 animate-pulse" : "bg-slate-500"
                  }`}
                />
                {autoRefresh ? "자동 갱신 켜짐" : "자동 갱신 꺼짐"}
              </span>
              <span>마지막 업데이트: <span className="tabular-nums text-slate-300">{formatTime(lastUpdated)}</span></span>
            </div>

            {/* 본문 */}
            <main className="mt-6">
              {loading ? (
                // 첫 로딩 스켈레톤
                <div className="grid grid-cols-1 gap-5 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4">
                  {COIN_IDS.map((id) => (
                    <div
                      key={id}
                      className="animate-pulse rounded-2xl border border-slate-700/50 bg-slate-800/40 p-5"
                    >
                      <div className="flex items-center gap-3">
                        <div className="h-10 w-10 rounded-full bg-slate-700" />
                        <div className="flex-1 space-y-2">
                          <div className="h-3 w-2/3 rounded bg-slate-700" />
                          <div className="h-2 w-1/2 rounded bg-slate-700" />
                        </div>
                      </div>
                      <div className="mt-5 h-6 w-3/4 rounded bg-slate-700" />
                      <div className="mt-4 h-3 w-1/3 rounded bg-slate-700" />
                    </div>
                  ))}
                </div>
              ) : error ? (
                <ErrorBox message={error} onRetry={() => fetchCoins(true)} />
              ) : (
                <div className="grid grid-cols-1 gap-5 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4">
                  {coins.map((coin) => (
                    <CoinCard key={coin.id} coin={coin} flashKey={flashKey} />
                  ))}
                </div>
              )}
            </main>

            {/* 푸터 */}
            <footer className="mt-10 text-center text-xs text-slate-500">
              데이터 제공: CoinGecko · 투자 결정의 근거로 사용하지 마세요.
            </footer>
          </div>
        </div>
      );
    }

    // ========================================
    // Rendering
    // ========================================
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
