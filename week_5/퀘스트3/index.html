<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>우리반 자유게시판</title>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <!-- ⚠️ Babel standalone 은 반드시 7.23.5 로 고정한다. 최신(8.x)으로 올라가면
       type="text/babel" 인라인 변환이 깨져 빈 화면이 뜬다. -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.23.5/babel.min.js"></script>
  <style>
    /* Tailwind 으로 표현하기 어려운 부드러운 진입 애니메이션 */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in-up { animation: fadeInUp 0.35s ease-out both; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .animate-spin-slow { animation: spin 0.8s linear infinite; }
  </style>
</head>
<body class="bg-slate-50">
  <div id="root"></div>

  <script type="text/babel">
    // ========================================
    // React Hooks
    // ========================================
    const { useState, useEffect, useMemo, useCallback, useRef } = React;

    // ========================================
    // 설정 (API)
    // ========================================
    // 같은 오리진에서 API 가 제공되므로 상대경로 사용 (localhost 하드코딩 금지)
    const API_BASE_URL = '/api';

    // ========================================
    // 🔐 인증 토큰 저장 (localStorage)
    // ========================================
    const TOKEN_KEY = 'board_token';
    const USER_KEY = 'board_user';
    function loadAuth() {
      const token = localStorage.getItem(TOKEN_KEY);
      if (!token) return null;
      return { token, username: localStorage.getItem(USER_KEY) || '' };
    }
    function saveAuth(token, username) {
      localStorage.setItem(TOKEN_KEY, token);
      localStorage.setItem(USER_KEY, username || '');
    }
    function clearAuth() {
      localStorage.removeItem(TOKEN_KEY);
      localStorage.removeItem(USER_KEY);
    }

    // ========================================
    // 🕒 시간 포맷 유틸 (상대시간 / 절대시간)
    // ========================================
    function formatTime(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      if (isNaN(d.getTime())) return '';
      const diffMs = Date.now() - d.getTime();
      const sec = Math.floor(diffMs / 1000);
      if (sec < 0) return '방금 전';
      if (sec < 60) return '방금 전';
      const min = Math.floor(sec / 60);
      if (min < 60) return `${min}분 전`;
      const hour = Math.floor(min / 60);
      if (hour < 24) return `${hour}시간 전`;
      const day = Math.floor(hour / 24);
      if (day < 7) return `${day}일 전`;
      // 일주일 이상은 절대시간 표기
      const p = (n) => String(n).padStart(2, '0');
      return `${d.getFullYear()}.${p(d.getMonth() + 1)}.${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
    }
    function fullTime(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      if (isNaN(d.getTime())) return '';
      const p = (n) => String(n).padStart(2, '0');
      return `${d.getFullYear()}.${p(d.getMonth() + 1)}.${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
    }
    // 이름 첫 글자로 아바타 (색상은 이름 해시로 결정)
    const AVATAR_COLORS = [
      'bg-rose-500', 'bg-orange-500', 'bg-amber-500', 'bg-emerald-500',
      'bg-teal-500', 'bg-sky-500', 'bg-indigo-500', 'bg-violet-500', 'bg-fuchsia-500',
    ];
    function avatarColor(name) {
      const s = name || '?';
      let h = 0;
      for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
      return AVATAR_COLORS[h % AVATAR_COLORS.length];
    }

    // ========================================
    // 🎨 Design System Components
    // ========================================
    function Card({ children, className = '' }) {
      return (
        <div className={`rounded-2xl bg-white shadow-sm ring-1 ring-slate-200/70 ${className}`}>
          {children}
        </div>
      );
    }

    function Button({ children, variant = 'primary', size = 'md', type = 'button', disabled, onClick, className = '' }) {
      const base = 'inline-flex items-center justify-center gap-1.5 font-semibold transition focus:outline-none focus:ring-2 focus:ring-offset-1 disabled:opacity-60 disabled:cursor-not-allowed';
      const sizes = {
        sm: 'rounded-lg px-3 py-1.5 text-xs',
        md: 'rounded-xl px-4 py-2 text-sm',
        lg: 'rounded-xl px-5 py-2.5 text-sm',
      };
      const variants = {
        primary: 'bg-indigo-600 text-white shadow-sm hover:bg-indigo-700 focus:ring-indigo-300',
        secondary: 'bg-white text-slate-700 ring-1 ring-inset ring-slate-300 hover:bg-slate-50 focus:ring-slate-300',
        danger: 'bg-red-600 text-white shadow-sm hover:bg-red-700 focus:ring-red-300',
        ghost: 'text-slate-600 hover:bg-slate-100 focus:ring-slate-300',
      };
      return (
        <button type={type} disabled={disabled} onClick={onClick}
          className={`${base} ${sizes[size]} ${variants[variant]} ${className}`}>
          {children}
        </button>
      );
    }

    const inputCls = 'w-full rounded-xl border border-slate-300 px-3 py-2.5 text-sm text-slate-800 placeholder-slate-400 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200';

    function Avatar({ name, size = 'md' }) {
      const dim = size === 'sm' ? 'h-7 w-7 text-xs' : size === 'lg' ? 'h-11 w-11 text-base' : 'h-9 w-9 text-sm';
      return (
        <span className={`inline-flex shrink-0 items-center justify-center rounded-full font-bold text-white ${avatarColor(name)} ${dim}`} aria-hidden="true">
          {(name || '?').charAt(0).toUpperCase()}
        </span>
      );
    }

    function Spinner({ label = '불러오는 중...' }) {
      return (
        <div className="flex flex-col items-center justify-center gap-3 py-24 text-slate-500" role="status" aria-live="polite">
          <div className="h-10 w-10 rounded-full border-4 border-slate-200 border-t-indigo-500 animate-spin-slow" aria-hidden="true"></div>
          <p className="text-sm">{label}</p>
        </div>
      );
    }

    function ErrorState({ message, onRetry }) {
      return (
        <Card className="mx-auto max-w-md p-8 text-center">
          <div className="mx-auto mb-4 flex h-12 w-12 items-center justify-center rounded-full bg-red-100 text-2xl" aria-hidden="true">⚠️</div>
          <h2 className="text-lg font-bold text-slate-800">문제가 발생했어요</h2>
          <p className="mt-2 break-words text-sm text-slate-500">{message}</p>
          {onRetry && <div className="mt-6"><Button onClick={onRetry} size="lg">다시 시도</Button></div>}
        </Card>
      );
    }

    // ========================================
    // 🔐 로그인 / 회원가입 화면
    // ========================================
    function AuthScreen({ onAuthed }) {
      const [mode, setMode] = useState('login'); // 'login' | 'signup'
      const [username, setUsername] = useState('');
      const [password, setPassword] = useState('');
      const [submitting, setSubmitting] = useState(false);
      const [err, setErr] = useState(null);
      const isLogin = mode === 'login';

      const switchMode = (m) => { setMode(m); setErr(null); };

      const submit = (e) => {
        e.preventDefault();
        setErr(null);
        const u = username.trim();
        if (!u || !password) { setErr('아이디와 비밀번호를 입력해 주세요.'); return; }
        if (!isLogin) {
          if (u.length < 3 || u.length > 30) { setErr('아이디는 3~30자로 입력해 주세요.'); return; }
          if (password.length < 4) { setErr('비밀번호는 4자 이상 입력해 주세요.'); return; }
        }
        setSubmitting(true);
        fetch(`${API_BASE_URL}/auth/${mode}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: u, password }),
        })
          .then((res) => res.json().then((data) => ({ ok: res.ok, status: res.status, data })))
          .then(({ ok, status, data }) => {
            if (!ok || !data.success) {
              if (status === 409) throw new Error(data.message || '이미 사용 중인 아이디입니다.');
              throw new Error(data.message || (isLogin ? '아이디 또는 비밀번호가 올바르지 않습니다.' : '회원가입에 실패했습니다.'));
            }
            saveAuth(data.token, data.username);
            onAuthed({ token: data.token, username: data.username });
          })
          .catch((e2) => setErr(e2.message))
          .finally(() => setSubmitting(false));
      };

      return (
        <div className="flex min-h-screen items-center justify-center px-4 py-10">
          <div className="w-full max-w-sm animate-fade-in-up">
            <div className="mb-6 text-center">
              <div className="mx-auto mb-3 flex h-14 w-14 items-center justify-center rounded-2xl bg-indigo-600 text-3xl shadow-lg shadow-indigo-200" aria-hidden="true">💬</div>
              <h1 className="text-2xl font-extrabold tracking-tight text-slate-900">우리반 자유게시판</h1>
              <p className="mt-1 text-sm text-slate-500">수강생끼리 질문 · 자랑 · 꿀팁을 나눠요</p>
            </div>

            <Card className="p-7">
              {/* 모드 전환 탭 */}
              <div className="mb-5 grid grid-cols-2 gap-1 rounded-xl bg-slate-100 p-1">
                {[['login', '로그인'], ['signup', '회원가입']].map(([key, label]) => (
                  <button key={key} type="button" onClick={() => switchMode(key)}
                    className={`rounded-lg py-2 text-sm font-semibold transition ${
                      mode === key ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-500 hover:text-slate-700'
                    }`}>
                    {label}
                  </button>
                ))}
              </div>

              <form onSubmit={submit} className="space-y-4">
                <div>
                  <label className="mb-1 block text-xs font-semibold text-slate-600">아이디</label>
                  <input className={inputCls} value={username} onChange={(e) => setUsername(e.target.value)}
                    placeholder="아이디 (3~30자)" autoComplete="username" autoFocus />
                </div>
                <div>
                  <label className="mb-1 block text-xs font-semibold text-slate-600">비밀번호</label>
                  <input type="password" className={inputCls} value={password} onChange={(e) => setPassword(e.target.value)}
                    placeholder="비밀번호 (4자 이상)" autoComplete={isLogin ? 'current-password' : 'new-password'} />
                </div>

                {err && (
                  <div className="rounded-xl bg-red-50 px-3 py-2.5 text-sm text-red-600 ring-1 ring-inset ring-red-100">
                    {err}
                  </div>
                )}

                <Button type="submit" size="lg" disabled={submitting} className="w-full">
                  {submitting ? '처리 중...' : isLogin ? '로그인' : '회원가입'}
                </Button>
              </form>

              <p className="mt-5 text-center text-xs text-slate-400">
                아이디 3~30자 · 비밀번호 4자 이상
              </p>
            </Card>

            <p className="mt-5 text-center text-sm text-slate-500">
              {isLogin ? '아직 계정이 없나요? ' : '이미 계정이 있나요? '}
              <button type="button" onClick={() => switchMode(isLogin ? 'signup' : 'login')}
                className="font-semibold text-indigo-600 hover:underline">
                {isLogin ? '회원가입' : '로그인'}
              </button>
            </p>
          </div>
        </div>
      );
    }

    // ========================================
    // 🧩 상단바
    // ========================================
    function TopBar({ username, onLogout, onHome }) {
      return (
        <header className="sticky top-0 z-20 border-b border-slate-200 bg-white/80 backdrop-blur">
          <div className="mx-auto flex max-w-3xl items-center justify-between gap-3 px-4 py-3 sm:px-6">
            <button onClick={onHome} className="flex items-center gap-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-200">
              <span className="flex h-8 w-8 items-center justify-center rounded-xl bg-indigo-600 text-lg" aria-hidden="true">💬</span>
              <span className="text-base font-extrabold tracking-tight text-slate-900">우리반 자유게시판</span>
            </button>
            <div className="flex items-center gap-2 sm:gap-3">
              <span className="hidden items-center gap-1.5 text-sm text-slate-600 sm:flex">
                <Avatar name={username} size="sm" />
                <span className="font-semibold text-slate-800">{username}</span>
                <span className="text-slate-400">님</span>
              </span>
              <Button variant="secondary" size="sm" onClick={onLogout}>로그아웃</Button>
            </div>
          </div>
        </header>
      );
    }

    // ========================================
    // 🧩 게시글 목록 아이템
    // ========================================
    function PostListItem({ post, onOpen }) {
      const preview = (post.content || '').replace(/\s+/g, ' ').trim();
      return (
        <Card
          className="cursor-pointer p-5 transition hover:-translate-y-0.5 hover:shadow-md animate-fade-in-up"
        >
          <div onClick={() => onOpen(post.id)} role="button" tabIndex={0}
            onKeyDown={(e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onOpen(post.id); } }}>
            <div className="flex items-start justify-between gap-3">
              <h3 className="min-w-0 flex-1 break-words text-lg font-bold leading-snug text-slate-900">
                {post.title}
              </h3>
              {post.mine && (
                <span className="shrink-0 rounded-full bg-indigo-50 px-2 py-0.5 text-xs font-semibold text-indigo-600 ring-1 ring-inset ring-indigo-100">
                  내 글
                </span>
              )}
            </div>
            {preview && (
              <p className="mt-2 line-clamp-2 text-sm leading-relaxed text-slate-500">
                {preview}
              </p>
            )}
            <div className="mt-4 flex items-center gap-2 text-xs text-slate-400">
              <Avatar name={post.authorName} size="sm" />
              <span className="font-semibold text-slate-600">{post.authorName}</span>
              <span aria-hidden="true">·</span>
              <span>{formatTime(post.createdAt)}</span>
              {post.updatedAt && post.updatedAt !== post.createdAt && (
                <span className="text-slate-400">(수정됨)</span>
              )}
            </div>
          </div>
        </Card>
      );
    }

    // ========================================
    // 📄 게시글 목록 화면
    // ========================================
    function PostListView({ authFetch, onOpen, onWrite }) {
      const [posts, setPosts] = useState([]);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);

      const fetchPosts = useCallback(() => {
        setLoading(true);
        setError(null);
        authFetch(`${API_BASE_URL}/posts`)
          .then((res) => {
            if (!res.ok) throw new Error(`서버 응답 오류 (HTTP ${res.status})`);
            return res.json();
          })
          .then((data) => setPosts(Array.isArray(data) ? data : []))
          .catch((e) => setError(e.message || '알 수 없는 오류가 발생했습니다.'))
          .finally(() => setLoading(false));
      }, [authFetch]);

      useEffect(() => { fetchPosts(); }, [fetchPosts]);

      return (
        <div>
          <div className="mb-5 flex items-end justify-between gap-3">
            <div>
              <h1 className="text-2xl font-extrabold tracking-tight text-slate-900">전체 글</h1>
              <p className="mt-1 text-sm text-slate-500">
                {loading ? ' ' : `${posts.length}개의 이야기가 올라와 있어요`}
              </p>
            </div>
            <Button size="lg" onClick={onWrite}>
              <span className="text-base leading-none">✏️</span> 글쓰기
            </Button>
          </div>

          {loading ? (
            <Spinner label="게시글을 불러오는 중..." />
          ) : error ? (
            <ErrorState message={error} onRetry={fetchPosts} />
          ) : posts.length === 0 ? (
            <Card className="p-12 text-center">
              <div className="mx-auto mb-4 flex h-16 w-16 items-center justify-center rounded-full bg-slate-100 text-3xl" aria-hidden="true">📝</div>
              <h2 className="text-lg font-bold text-slate-800">아직 글이 없어요</h2>
              <p className="mt-2 text-sm text-slate-500">첫 글을 남겨보세요!</p>
              <div className="mt-6"><Button size="lg" onClick={onWrite}>✏️ 첫 글 쓰기</Button></div>
            </Card>
          ) : (
            <div className="space-y-3">
              {posts.map((p) => (
                <PostListItem key={p.id} post={p} onOpen={onOpen} />
              ))}
            </div>
          )}
        </div>
      );
    }

    // ========================================
    // 📄 게시글 상세 화면
    // ========================================
    function PostDetailView({ postId, authFetch, onBack, onEdit, onDeleted }) {
      const [post, setPost] = useState(null);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);
      const [deleting, setDeleting] = useState(false);

      const fetchPost = useCallback(() => {
        setLoading(true);
        setError(null);
        authFetch(`${API_BASE_URL}/posts/${postId}`)
          .then((res) => {
            if (res.status === 404) throw new Error('삭제되었거나 존재하지 않는 글입니다.');
            if (!res.ok) throw new Error(`서버 응답 오류 (HTTP ${res.status})`);
            return res.json();
          })
          .then((data) => setPost(data))
          .catch((e) => setError(e.message))
          .finally(() => setLoading(false));
      }, [authFetch, postId]);

      useEffect(() => { fetchPost(); }, [fetchPost]);

      const handleDelete = () => {
        if (!window.confirm('이 글을 삭제할까요? 삭제하면 되돌릴 수 없어요.')) return;
        setDeleting(true);
        authFetch(`${API_BASE_URL}/posts/${postId}`, { method: 'DELETE' })
          .then((res) => res.json().then((data) => ({ ok: res.ok, status: res.status, data })))
          .then(({ ok, status, data }) => {
            if (status === 403) throw new Error('본인 글만 삭제할 수 있어요.');
            if (!ok || !data.success) throw new Error((data && data.message) || '삭제에 실패했습니다.');
            onDeleted();
          })
          .catch((e) => { window.alert(e.message); setDeleting(false); });
      };

      return (
        <div className="animate-fade-in-up">
          <button onClick={onBack} className="mb-4 inline-flex items-center gap-1 text-sm font-semibold text-slate-500 hover:text-slate-700">
            <span aria-hidden="true">←</span> 목록으로
          </button>

          {loading ? (
            <Spinner label="글을 불러오는 중..." />
          ) : error ? (
            <ErrorState message={error} onRetry={fetchPost} />
          ) : post ? (
            <Card className="p-6 sm:p-8">
              <div className="flex items-start justify-between gap-3">
                <h1 className="min-w-0 flex-1 break-words text-2xl font-extrabold leading-snug tracking-tight text-slate-900">
                  {post.title}
                </h1>
                {post.mine && (
                  <span className="shrink-0 rounded-full bg-indigo-50 px-2.5 py-1 text-xs font-semibold text-indigo-600 ring-1 ring-inset ring-indigo-100">
                    내 글
                  </span>
                )}
              </div>

              <div className="mt-4 flex items-center gap-3 border-b border-slate-100 pb-5">
                <Avatar name={post.authorName} size="lg" />
                <div className="min-w-0">
                  <p className="font-semibold text-slate-800">{post.authorName}</p>
                  <p className="text-xs text-slate-400">
                    {fullTime(post.createdAt)}
                    {post.updatedAt && post.updatedAt !== post.createdAt && (
                      <span> · 수정됨 {formatTime(post.updatedAt)}</span>
                    )}
                  </p>
                </div>
              </div>

              <div className="whitespace-pre-wrap break-words pt-5 text-[15px] leading-7 text-slate-700">
                {post.content}
              </div>

              {post.mine && (
                <div className="mt-8 flex items-center justify-end gap-2 border-t border-slate-100 pt-5">
                  <Button variant="secondary" onClick={() => onEdit(post)}>
                    <span aria-hidden="true">✏️</span> 수정
                  </Button>
                  <Button variant="danger" onClick={handleDelete} disabled={deleting}>
                    <span aria-hidden="true">🗑</span> {deleting ? '삭제 중...' : '삭제'}
                  </Button>
                </div>
              )}
            </Card>
          ) : null}
        </div>
      );
    }

    // ========================================
    // ✏️ 글쓰기 / 수정 화면 (폼 재사용)
    // ========================================
    function PostFormView({ mode, initial, authFetch, onCancel, onSaved }) {
      const [title, setTitle] = useState(initial ? initial.title : '');
      const [content, setContent] = useState(initial ? initial.content : '');
      const [submitting, setSubmitting] = useState(false);
      const [err, setErr] = useState(null);
      const isEdit = mode === 'edit';

      const submit = (e) => {
        e.preventDefault();
        setErr(null);
        const t = title.trim();
        const c = content.trim();
        if (!t) { setErr('제목을 입력해 주세요.'); return; }
        if (!c) { setErr('내용을 입력해 주세요.'); return; }
        setSubmitting(true);
        const url = isEdit ? `${API_BASE_URL}/posts/${initial.id}` : `${API_BASE_URL}/posts`;
        const method = isEdit ? 'PUT' : 'POST';
        authFetch(url, {
          method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title: t, content: c }),
        })
          .then((res) => res.json().then((data) => ({ ok: res.ok, status: res.status, data })))
          .then(({ ok, status, data }) => {
            if (status === 403) throw new Error('본인 글만 수정할 수 있어요.');
            if (!ok || (data && data.success === false)) {
              throw new Error((data && data.message) || (isEdit ? '수정에 실패했습니다.' : '작성에 실패했습니다.'));
            }
            onSaved(data);
          })
          .catch((e2) => { setErr(e2.message); setSubmitting(false); });
      };

      return (
        <div className="animate-fade-in-up">
          <button onClick={onCancel} className="mb-4 inline-flex items-center gap-1 text-sm font-semibold text-slate-500 hover:text-slate-700">
            <span aria-hidden="true">←</span> 취소하고 돌아가기
          </button>

          <Card className="p-6 sm:p-8">
            <h1 className="mb-6 text-xl font-extrabold tracking-tight text-slate-900">
              {isEdit ? '글 수정' : '새 글 쓰기'}
            </h1>
            <form onSubmit={submit} className="space-y-5">
              <div>
                <label className="mb-1.5 block text-sm font-semibold text-slate-700">제목</label>
                <input className={inputCls} value={title} onChange={(e) => setTitle(e.target.value)}
                  placeholder="제목을 입력하세요" autoFocus maxLength={120} />
              </div>
              <div>
                <label className="mb-1.5 block text-sm font-semibold text-slate-700">내용</label>
                <textarea className={inputCls + ' resize-y leading-7'} rows={10}
                  value={content} onChange={(e) => setContent(e.target.value)}
                  placeholder="자유롭게 질문, 자랑, 꿀팁을 남겨보세요" />
              </div>

              {err && (
                <div className="rounded-xl bg-red-50 px-3 py-2.5 text-sm text-red-600 ring-1 ring-inset ring-red-100">
                  {err}
                </div>
              )}

              <div className="flex items-center justify-end gap-2 border-t border-slate-100 pt-5">
                <Button variant="ghost" onClick={onCancel}>취소</Button>
                <Button type="submit" size="lg" disabled={submitting}>
                  {submitting ? '저장 중...' : isEdit ? '수정 완료' : '등록하기'}
                </Button>
              </div>
            </form>
          </Card>
        </div>
      );
    }

    // ========================================
    // 🚀 게시판 (로그인 후) — state 기반 뷰 전환
    // ========================================
    function Board({ auth, onLogout }) {
      // view: { name: 'list' | 'detail' | 'write' | 'edit', postId?, post? }
      const [view, setView] = useState({ name: 'list' });
      // 목록 강제 새로고침용 키 (작성/수정/삭제 후 목록 갱신)
      const [listKey, setListKey] = useState(0);

      // 인증 토큰을 실은 fetch. 401 이면 로그아웃 처리.
      const authFetch = useCallback((path, opts = {}) => {
        const headers = Object.assign({}, opts.headers, { Authorization: `Bearer ${auth.token}` });
        return fetch(path, Object.assign({}, opts, { headers })).then((res) => {
          if (res.status === 401) {
            onLogout();
            throw new Error('세션이 만료되었습니다. 다시 로그인해 주세요.');
          }
          return res;
        });
      }, [auth.token, onLogout]);

      const goList = () => { setListKey((k) => k + 1); setView({ name: 'list' }); window.scrollTo(0, 0); };
      const goDetail = (postId) => { setView({ name: 'detail', postId }); window.scrollTo(0, 0); };
      const goWrite = () => { setView({ name: 'write' }); window.scrollTo(0, 0); };
      const goEdit = (post) => { setView({ name: 'edit', post }); window.scrollTo(0, 0); };

      return (
        <div className="min-h-screen">
          <TopBar username={auth.username} onLogout={onLogout} onHome={goList} />

          <main className="mx-auto max-w-3xl px-4 py-8 sm:px-6">
            {view.name === 'list' && (
              <PostListView key={listKey} authFetch={authFetch} onOpen={goDetail} onWrite={goWrite} />
            )}

            {view.name === 'detail' && (
              <PostDetailView
                postId={view.postId}
                authFetch={authFetch}
                onBack={goList}
                onEdit={goEdit}
                onDeleted={goList}
              />
            )}

            {view.name === 'write' && (
              <PostFormView
                mode="create"
                authFetch={authFetch}
                onCancel={goList}
                onSaved={(created) => {
                  if (created && created.id != null) goDetail(created.id);
                  else goList();
                }}
              />
            )}

            {view.name === 'edit' && (
              <PostFormView
                mode="edit"
                initial={view.post}
                authFetch={authFetch}
                onCancel={() => goDetail(view.post.id)}
                onSaved={(updated) => {
                  const id = (updated && updated.id != null) ? updated.id : view.post.id;
                  goDetail(id);
                }}
              />
            )}
          </main>

          <footer className="mx-auto max-w-3xl px-4 py-10 text-center text-xs text-slate-400 sm:px-6">
            우리반 자유게시판 · React + Tailwind 단일 파일 앱
          </footer>
        </div>
      );
    }

    // ========================================
    // 🌳 Root: 로그인 여부에 따라 화면 분기
    // ========================================
    function RootApp() {
      const [auth, setAuth] = useState(loadAuth);

      const handleAuthed = (a) => setAuth(a);
      const handleLogout = useCallback(() => { clearAuth(); setAuth(null); }, []);

      if (!auth) return <AuthScreen onAuthed={handleAuthed} />;
      return <Board auth={auth} onLogout={handleLogout} />;
    }

    // ========================================
    // Rendering
    // ========================================
    ReactDOM.createRoot(document.getElementById('root')).render(<RootApp />);
  </script>
</body>
</html>
