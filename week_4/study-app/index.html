<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>스터디플래너</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <!-- ⚠️ 모든 CDN 버전 고정. @babel/standalone 미고정 시 8.x 로 올라가 인라인 변환이 깨져 빈 화면이 됨. Babel 은 7.x 로 고정. -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.23.5/babel.min.js"></script>
  <!-- 완료 축하 빵빠레 (canvas-confetti, 버전 고정) -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <style>
    :root { --cream: #F6F3EC; }
    body {
      font-family: 'Pretendard', 'Pretendard Variable', -apple-system, 'Malgun Gothic', sans-serif;
      background-color: var(--cream);
      line-height: 1.7;
      letter-spacing: -0.01em;
      color: #44403c;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fadeIn { animation: fadeIn .3s ease-out; }
    .thin-scroll::-webkit-scrollbar { height: 8px; width: 8px; }
    .thin-scroll::-webkit-scrollbar-thumb { background: #ddd6cb; border-radius: 9999px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef, useCallback } = React;

    const API_BASE_URL = '/api';

    // 인증 토큰 보관 + 인증 포함 fetch (401 이면 자동 로그아웃)
    const Auth = { token: localStorage.getItem('study-token') || null, onLogout: () => {} };
    async function apiFetch(path, opts = {}) {
      const headers = { ...(opts.headers || {}) };
      if (Auth.token) headers['X-Auth-Token'] = Auth.token;
      const res = await fetch(`${API_BASE_URL}${path}`, { ...opts, headers });
      if (res.status === 401) { Auth.onLogout(); throw new Error('unauthorized'); }
      return res;
    }

    // 상단 응원 문구 — 따뜻하고 격려하는 메시지. 1시간마다 랜덤으로 바뀐다.
    const MENTAL_MESSAGES = [
      '오늘도 너의 페이스대로, 묵묵하게 ☕',
      '지치지 않는 마음이 가장 중요해. 힘내자 ✨',
      '조급해하지 않아도 괜찮아, 한 걸음씩 🌱',
      '어제의 나보다 한 뼘 더. 그거면 충분해 🌿',
      '쌓아온 시간은 절대 배신하지 않아 📚',
      '잘하고 있어. 오늘도 차분하게 🍃',
      '완벽하지 않아도 돼. 꾸준함이 너를 데려다줄 거야 🌷',
      '지금 이 순간의 집중, 분명 빛이 될 거야 ⭐',
      '힘든 날엔 잠깐 쉬어가도 괜찮아 🫶',
      '너의 노력은 조용히, 그러나 분명히 자라고 있어 🌳',
      '오늘 펼친 책 한 장이 내일의 자신감이 돼 💛',
      '천천히 가도 멈추지만 않으면 돼. 응원해 🤍',
    ];
    // 메시지 선택: 1시간 단위 + 1주일 단위로 변경
    // (매시간 바뀌고, 주마다 시작 오프셋이 달라져 같은 시각이라도 주별로 다른 문구)
    function currentMessage() {
      const n = MENTAL_MESSAGES.length;
      const hourIdx = Math.floor(Date.now() / 3600000);
      const weekIdx = Math.floor(Date.now() / (3600000 * 24 * 7));
      return MENTAL_MESSAGES[((hourIdx * 7 + weekIdx * 5) % n + n) % n];
    }
    // 앱을 켜둔 채 시(時)가 바뀌어도 자동 갱신
    function useHourlyMessage() {
      const [msg, setMsg] = useState(currentMessage());
      useEffect(() => {
        const id = setInterval(() => setMsg(currentMessage()), 60000); // 1분마다 확인, 시 바뀌면 교체
        return () => clearInterval(id);
      }, []);
      return msg;
    }

    // 🎉 완료 축하 빵빠레
    function celebrate() {
      if (typeof confetti !== 'function') return;
      const colors = ['#34d399', '#fbbf24', '#f472b6', '#818cf8', '#fcd34d', '#86efac'];
      confetti({ particleCount: 70, spread: 65, startVelocity: 38, origin: { y: 0.7 }, colors, scalar: 0.9 });
      confetti({ particleCount: 30, spread: 100, decay: 0.92, scalar: 1.1, origin: { y: 0.7 }, colors });
      try {
        if (confetti.shapeFromText) {
          const shapes = ['🎉', '✨', '🌟'].map((t) => confetti.shapeFromText({ text: t, scalar: 2 }));
          confetti({ particleCount: 10, spread: 90, scalar: 2, shapes, origin: { y: 0.65 } });
        }
      } catch (e) { /* 이모지 미지원 시 무시 */ }
    }

    // 과목 정의: 이름 / 대표 이모지 / 차분한 색상 (통과=통합과학, 통사=통합사회)
    const SUBJECTS = [
      { name: '수학', emoji: '📐', dot: 'bg-indigo-400',  chip: 'bg-indigo-50 text-indigo-700 border-indigo-200',  text: 'text-indigo-700' },
      { name: '통과', emoji: '🔬', dot: 'bg-emerald-400', chip: 'bg-emerald-50 text-emerald-700 border-emerald-200', text: 'text-emerald-700' },
      { name: '영어', emoji: '🔤', dot: 'bg-rose-300',    chip: 'bg-rose-50 text-rose-600 border-rose-200',        text: 'text-rose-600' },
      { name: '국어', emoji: '📖', dot: 'bg-amber-400',   chip: 'bg-amber-50 text-amber-700 border-amber-200',     text: 'text-amber-700' },
      { name: '통사', emoji: '🌏', dot: 'bg-teal-400',    chip: 'bg-teal-50 text-teal-700 border-teal-200',        text: 'text-teal-700' },
    ];
    const SUBJECT_PRESETS = SUBJECTS.map((s) => s.name);
    const subjectOf = (name) => SUBJECTS.find((s) => s.name === name);
    // 사용자가 새로 추가한 과목용 기본 스타일
    const DEFAULT_CONF = { emoji: '📘', dot: 'bg-stone-400', chip: 'bg-stone-100 text-stone-600 border-stone-200', text: 'text-stone-600' };
    const subjConf = (name) => subjectOf(name) || DEFAULT_CONF;
    // 프리셋 + 사용자 추가 과목(교재맵 키) 합친 전체 과목 목록
    const allSubjects = (textbooks) => [...SUBJECT_PRESETS, ...Object.keys(textbooks || {}).filter((k) => !SUBJECT_PRESETS.includes(k))];

    // 과목별 대한민국 고등학생 인기 교재 TOP 10 (대표 베스트셀러 기준, 대략적 랭킹)
    const POPULAR_TEXTBOOKS = {
      '수학': ['쎈(SSEN)', '개념원리', '마플교과서', 'RPM', '자이스토리', '블랙라벨', '일품', '수학의 정석', '고쟁이', '마더텅 기출'],
      '통과': ['오투(O₂) 통합과학', '완자 통합과학', '하이탑 통합과학', '셀파 통합과학', '자이스토리 통합과학', '마더텅 통합과학', '개념플러스유형', 'EBS 개념완성', '미래엔 교과서', '비상 교과서'],
      '영어': ['천일문', '워드마스터', '능률 VOCA', '어휘끝', '자이스토리 영어', '마더텅 영어', '그래머존', '첫단추', '빠른독해 바른독해', 'EBS 수능특강 영어'],
      '국어': ['마더텅 국어', '자이스토리 국어', '매3비(매일 3단계)', '매3문', '국어의 기술', '윤혜정의 개념의 나비효과', '떠먹는 국어문법', '우기분', '메가스터디 N제', 'EBS 수능특강 국어'],
      '통사': ['오투(O₂) 통합사회', '완자 통합사회', '셀파 통합사회', '마더텅 통합사회', '자이스토리 통합사회', '하이탑 통합사회', 'EBS 통합사회', '개념완성 통합사회', '미래엔 교과서', '비상 교과서'],
    };

    const pad = (n) => String(n).padStart(2, '0');
    const DEFAULT_ROWS = 5;

    const blankRow = () => ({ time: '', subject: '', textbook: '', goal: '', status: '미정', lacking: '' });
    function normRow(s) {
      s = s || {};
      return { time: s.time || '', subject: s.subject || '', textbook: s.textbook || '', goal: s.goal || '', status: s.status || '미정', lacking: s.lacking || '' };
    }
    function buildDayRows(stored) {
      let rows = [];
      if (Array.isArray(stored)) rows = stored.map(normRow);
      else if (stored && typeof stored === 'object') rows = Object.values(stored).map(normRow);
      while (rows.length < DEFAULT_ROWS) rows.push(blankRow());
      return rows;
    }

    const toKey = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    const todayKey = () => toKey(new Date());
    const fmtH = (h) => (Number.isInteger(h) ? `${h}` : `${h}`) + '시간';

    // D-day 계산: 양수면 D-n, 당일 D-DAY, 지났으면 D+n
    function ddayInfo(dateStr) {
      const today = new Date(); today.setHours(0, 0, 0, 0);
      const [y, m, d] = dateStr.split('-').map(Number);
      const ev = new Date(y, m - 1, d); ev.setHours(0, 0, 0, 0);
      const diff = Math.round((ev - today) / 86400000);
      const label = diff > 0 ? `D-${diff}` : diff === 0 ? 'D-DAY' : `D+${-diff}`;
      const w = ['일', '월', '화', '수', '목', '금', '토'][ev.getDay()];
      return { diff, label, pretty: `${y}.${pad(m)}.${pad(d)} (${w})` };
    }
    // 일정 정렬: 다가오는 일정(미래) 먼저(가까운 순), 지난 건 뒤로
    function sortEvents(list) {
      return [...(list || [])].sort((a, b) => {
        const da = ddayInfo(a.date).diff, db = ddayInfo(b.date).diff;
        const fa = da >= 0, fb = db >= 0;
        if (fa && fb) return da - db;
        if (fa) return -1; if (fb) return 1;
        return db - da;
      });
    }

    // ========================================
    // 공통 컴포넌트
    // ========================================
    function SoftButton({ className = '', ...props }) {
      return <button className={`inline-flex items-center justify-center font-medium rounded-full transition focus:outline-none focus:ring-2 focus:ring-stone-300 disabled:opacity-40 ${className}`} {...props} />;
    }

    // 드롭다운 + 인라인 직접입력
    function ComboSelect({ value, options, onChange, emptyLabel, className = '' }) {
      const opts = Array.isArray(options) ? options : [];
      const inList = opts.includes(value);
      const [custom, setCustom] = useState(value !== '' && !inList);
      useEffect(() => { if (opts.includes(value)) setCustom(false); }, [value, opts.join('|')]);
      const cls = `text-sm rounded-lg border border-stone-200 px-3 py-2 bg-stone-50 placeholder-stone-300 focus:outline-none focus:ring-2 focus:ring-emerald-200 focus:bg-white ${className}`;
      if (custom) {
        return (
          <div className={`flex gap-1 ${className}`}>
            <input autoFocus type="text" value={value} onChange={(e) => onChange(e.target.value)} placeholder="직접 입력" className={cls + ' flex-1'} />
            <button type="button" onClick={() => { setCustom(false); onChange(''); }} title="목록에서 선택"
              className="shrink-0 px-2 rounded-lg border border-stone-200 text-stone-400 hover:bg-stone-100 text-sm">≡</button>
          </div>
        );
      }
      return (
        <select value={inList ? value : ''} onChange={(e) => { const v = e.target.value; if (v === '__custom__') { setCustom(true); onChange(''); } else onChange(v); }} className={cls}>
          <option value="">{emptyLabel}</option>
          {opts.map((o) => <option key={o} value={o}>{o}</option>)}
          <option value="__custom__">✎ 직접입력</option>
        </select>
      );
    }

    function SaveIndicator({ state }) {
      const map = {
        idle: null,
        saving: <span className="text-stone-300">저장 중…</span>,
        saved: <span className="text-emerald-500">✓ 저장됨</span>,
        error: <span className="text-rose-400">⚠ 저장 실패</span>,
      };
      return <span className="text-xs min-h-[1rem]" role="status" aria-live="polite">{map[state]}</span>;
    }

    // ========================================
    // 📒 교재 등록 팝업
    // ========================================
    function TextbookPopup({ textbooks, onSave, onClose }) {
      const subjects = allSubjects(textbooks);
      const [active, setActive] = useState(subjects[0] || SUBJECT_PRESETS[0]);
      const [saveState, setSaveState] = useState('idle');
      const [input, setInput] = useState('');
      const [newSubj, setNewSubj] = useState('');
      const [addingSubj, setAddingSubj] = useState(false);
      const conf = subjConf(active);
      const top10 = POPULAR_TEXTBOOKS[active] || [];
      const registered = textbooks[active] || [];

      const commit = async (next) => {
        setSaveState('saving');
        try {
          const res = await apiFetch(`/textbooks`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(next) });
          if (!res.ok) throw new Error('status ' + res.status);
          onSave(next); setSaveState('saved');
        } catch (e) { console.warn('교재 저장 실패:', e); setSaveState('error'); }
      };
      const toggle = (name) => { const cur = textbooks[active] || []; commit(cur.includes(name) ? { ...textbooks, [active]: cur.filter((b) => b !== name) } : { ...textbooks, [active]: [...cur, name] }); };
      const addCustom = () => { const name = input.trim(); if (!name) return; const cur = textbooks[active] || []; setInput(''); if (!cur.includes(name)) commit({ ...textbooks, [active]: [...cur, name] }); };
      const remove = (name) => { const cur = textbooks[active] || []; commit({ ...textbooks, [active]: cur.filter((b) => b !== name) }); };
      // 새 과목 추가
      const addSubject = () => {
        const name = newSubj.trim(); if (!name) return;
        setNewSubj(''); setAddingSubj(false);
        if (subjects.includes(name)) { setActive(name); return; }
        commit({ ...textbooks, [name]: textbooks[name] || [] });
        setActive(name);
      };

      return (
        <div className="fixed inset-0 z-50 bg-stone-900/30 backdrop-blur-sm flex items-center justify-center p-4" onClick={onClose}>
          <div className="bg-[#FBF9F4] rounded-3xl shadow-2xl w-full max-w-lg max-h-[88vh] overflow-y-auto thin-scroll animate-fadeIn" onClick={(e) => e.stopPropagation()}>
            <div className="flex items-center justify-between px-6 py-5">
              <h3 className="text-lg font-bold text-stone-700 flex items-center gap-2">📒 과목별 교재 등록</h3>
              <div className="flex items-center gap-3"><SaveIndicator state={saveState} /><button onClick={onClose} className="w-8 h-8 rounded-full text-stone-400 hover:bg-stone-200/60 text-xl" aria-label="닫기">×</button></div>
            </div>

            {/* 과목 선택 + 새 과목 추가 아이콘 */}
            <div className="px-6 flex flex-wrap items-center gap-2">
              {subjects.map((name) => {
                const c = subjConf(name);
                const cnt = (textbooks[name] || []).length;
                const on = name === active;
                return (
                  <button key={name} onClick={() => { setActive(name); setInput(''); }}
                    className={`inline-flex items-center gap-1.5 rounded-full px-3.5 py-2 text-sm font-semibold border transition ${on ? c.chip + ' shadow-sm' : 'bg-white border-stone-200 text-stone-500 hover:bg-stone-50'}`}>
                    <span>{c.emoji}</span>{name}{cnt > 0 && <span className="bg-stone-900/5 rounded-full px-1.5 text-xs">{cnt}</span>}
                  </button>
                );
              })}
              <button onClick={() => setAddingSubj(true)} title="새 과목 추가"
                className="inline-flex items-center justify-center w-9 h-9 rounded-full border-2 border-dashed border-stone-300 text-stone-400 hover:border-emerald-400 hover:text-emerald-500 transition">＋</button>
            </div>

            {addingSubj && (
              <div className="px-6 mt-3 flex gap-2">
                <input autoFocus type="text" value={newSubj} onChange={(e) => setNewSubj(e.target.value)} onKeyDown={(e) => { if (e.key === 'Enter') addSubject(); if (e.key === 'Escape') { setAddingSubj(false); setNewSubj(''); } }}
                  placeholder="새 과목명 (예: 한국사, 물리, 생활과 윤리)" className="flex-1 text-sm rounded-lg border border-stone-200 px-3 py-2 bg-white placeholder-stone-300 focus:outline-none focus:ring-2 focus:ring-emerald-200" />
                <SoftButton onClick={addSubject} className="bg-emerald-500 text-white px-4 py-2 text-sm hover:bg-emerald-600">과목 추가</SoftButton>
                <SoftButton onClick={() => { setAddingSubj(false); setNewSubj(''); }} className="text-stone-400 px-2 py-2 text-sm hover:bg-stone-200/50">취소</SoftButton>
              </div>
            )}

            <div className="m-6 mt-4 rounded-2xl bg-white border border-stone-100 p-5 shadow-sm">
              <p className={`text-sm font-bold mb-3 flex items-center gap-2 ${conf.text}`}><span className="text-xl">{conf.emoji}</span>{active}{top10.length > 0 ? ' · 인기 교재 TOP 10' : ' · 교재 직접 등록'}</p>

              {top10.length > 0 ? (
                <ul className="space-y-1.5">
                  {top10.map((name, i) => {
                    const on = registered.includes(name);
                    return (
                      <li key={name}>
                        <button onClick={() => toggle(name)}
                          className={`w-full flex items-center gap-3 rounded-xl border px-3 py-2.5 text-left transition ${on ? conf.chip : 'bg-stone-50/60 border-transparent hover:bg-stone-100'}`}>
                          <span className={`w-5 text-center text-sm font-bold ${i < 3 ? conf.text : 'text-stone-300'}`}>{i + 1}</span>
                          <span className="flex-1 text-sm text-stone-600">{name}</span>
                          <span className="text-sm text-stone-400">{on ? '✓' : '＋'}</span>
                        </button>
                      </li>
                    );
                  })}
                </ul>
              ) : (
                <p className="text-sm text-stone-400 bg-stone-50 rounded-xl px-3 py-3">직접 추가한 과목이에요. 아래에서 교재를 자유롭게 입력해 등록하세요 ✍️</p>
              )}

              <p className="text-sm font-semibold text-stone-500 mt-5 mb-2">직접 추가</p>
              <div className="flex gap-2">
                <input type="text" value={input} onChange={(e) => setInput(e.target.value)} onKeyDown={(e) => { if (e.key === 'Enter') addCustom(); }}
                  placeholder="교재명 입력 후 추가" className="flex-1 text-sm rounded-lg border border-stone-200 px-3 py-2 bg-stone-50 placeholder-stone-300 focus:outline-none focus:ring-2 focus:ring-emerald-200 focus:bg-white" />
                <SoftButton onClick={addCustom} className="bg-stone-700 text-white px-4 py-2 text-sm hover:bg-stone-800">추가</SoftButton>
              </div>

              {registered.length > 0 && (
                <div className="mt-5">
                  <p className="text-sm font-semibold text-stone-500 mb-2">등록된 교재 ({registered.length})</p>
                  <div className="flex flex-wrap gap-1.5">
                    {registered.map((b) => (
                      <span key={b} className={`inline-flex items-center gap-1 border rounded-full pl-3 pr-1.5 py-1 text-sm ${conf.chip}`}>
                        {b}<button onClick={() => remove(b)} aria-label="삭제" className="w-4 h-4 rounded-full hover:bg-stone-900/10 leading-none">×</button>
                      </span>
                    ))}
                  </div>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    // ========================================
    // 📌 시험 일정(D-day) 관리 팝업
    // ========================================
    function DdayPopup({ events, onSave, onClose }) {
      const [name, setName] = useState('');
      const [date, setDate] = useState('');
      const [saveState, setSaveState] = useState('idle');
      const sorted = sortEvents(events);

      const commit = async (next) => {
        setSaveState('saving');
        try {
          const res = await apiFetch(`/events`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(next) });
          if (!res.ok) throw new Error('status ' + res.status);
          const data = await res.json(); onSave(data.events || next); setSaveState('saved');
        } catch (e) { console.warn('일정 저장 실패:', e); setSaveState('error'); }
      };
      const add = () => {
        if (!name.trim() || !/^\d{4}-\d{2}-\d{2}$/.test(date)) return;
        commit([...(events || []), { name: name.trim(), date }]); setName(''); setDate('');
      };
      const remove = (idx) => commit((events || []).filter((_, i) => i !== idx));

      return (
        <div className="fixed inset-0 z-50 bg-stone-900/30 backdrop-blur-sm flex items-center justify-center p-4" onClick={onClose}>
          <div className="bg-[#FBF9F4] rounded-3xl shadow-2xl w-full max-w-md max-h-[88vh] overflow-y-auto thin-scroll animate-fadeIn" onClick={(e) => e.stopPropagation()}>
            <div className="flex items-center justify-between px-6 py-5">
              <h3 className="text-lg font-bold text-stone-700 flex items-center gap-2">📌 시험 일정 (D-day)</h3>
              <div className="flex items-center gap-3"><SaveIndicator state={saveState} /><button onClick={onClose} className="w-8 h-8 rounded-full text-stone-400 hover:bg-stone-200/60 text-xl" aria-label="닫기">×</button></div>
            </div>

            <div className="px-6 pb-2">
              <div className="bg-white rounded-2xl border border-stone-100 p-4 shadow-sm">
                <p className="text-sm font-semibold text-stone-500 mb-2">일정 추가</p>
                <input type="text" value={name} onChange={(e) => setName(e.target.value)} placeholder="예: 2027 수능, 6월 모의고사"
                  className="w-full mb-2 text-sm rounded-lg border border-stone-200 px-3 py-2 bg-stone-50 placeholder-stone-300 focus:outline-none focus:ring-2 focus:ring-emerald-200 focus:bg-white" />
                <div className="flex gap-2">
                  <input type="date" value={date} onChange={(e) => setDate(e.target.value)}
                    className="flex-1 text-sm rounded-lg border border-stone-200 px-3 py-2 bg-stone-50 focus:outline-none focus:ring-2 focus:ring-emerald-200 focus:bg-white" />
                  <SoftButton onClick={add} className="bg-emerald-500 text-white px-4 py-2 text-sm hover:bg-emerald-600">추가</SoftButton>
                </div>
              </div>
            </div>

            <div className="px-6 pb-6 pt-3">
              {sorted.length === 0 && <p className="text-sm text-stone-400 text-center py-4">등록된 일정이 없어요. 수능·모의고사 날짜를 추가해 보세요 📅</p>}
              <div className="space-y-2">
                {sorted.map((ev) => {
                  const realIdx = events.indexOf(ev);
                  const info = ddayInfo(ev.date);
                  return (
                    <div key={ev.name + ev.date} className="flex items-center gap-3 bg-white rounded-xl border border-stone-100 px-4 py-3 shadow-sm">
                      <div className="flex-1 min-w-0">
                        <div className="font-semibold text-stone-700 truncate">{ev.name}</div>
                        <div className="text-xs text-stone-400">{info.pretty}</div>
                      </div>
                      <span className={`text-sm font-extrabold tabular-nums ${info.diff < 0 ? 'text-stone-300' : info.diff <= 30 ? 'text-rose-500' : 'text-emerald-600'}`}>{info.label}</span>
                      <button onClick={() => remove(realIdx)} className="w-6 h-6 rounded-full text-stone-300 hover:bg-rose-50 hover:text-rose-400" aria-label="삭제">×</button>
                    </div>
                  );
                })}
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ========================================
    // 🗓 달력 (격자선 없음 + 깃허브 잔디)
    // ========================================
    const WEEK_LABELS = ['일', '월', '화', '수', '목', '금', '토'];
    const MONTH_LABEL = (y, m) => `${y}.${pad(m + 1)}`;

    function daySummary(plan) {
      if (!plan) return null;
      const rows = Array.isArray(plan) ? plan : Object.values(plan);
      let planned = 0, done = 0, netH = 0;
      rows.forEach((s) => {
        const hasContent = s && (s.subject || s.textbook || s.goal || s.lacking || (s.time && s.time.trim()));
        if (hasContent || (s && s.status && s.status !== '미정')) planned += 1;
        if (s && s.status === '완료') { done += 1; netH += 1; }
        else if (s && s.status === '부분') { netH += 0.5; }
      });
      if (planned === 0) return null;
      return { planned, done, netH };
    }

    // 깃허브 잔디: 순공시간(h)에 따른 농도
    function grass(h) {
      if (!h || h <= 0) return { bg: 'bg-stone-200/40', fg: 'text-stone-500' };
      if (h <= 1) return { bg: 'bg-emerald-100', fg: 'text-emerald-800' };
      if (h <= 2) return { bg: 'bg-emerald-200', fg: 'text-emerald-900' };
      if (h <= 4) return { bg: 'bg-emerald-400', fg: 'text-white' };
      return { bg: 'bg-emerald-600', fg: 'text-white' };
    }

    function Calendar({ plans, textbooks, events, onSelectDate, onSaveTextbooks, onSaveEvents }) {
      const [view, setView] = useState(() => { const d = new Date(); return { y: d.getFullYear(), m: d.getMonth() }; });
      const [tbOpen, setTbOpen] = useState(false);
      const [ddOpen, setDdOpen] = useState(false);
      const tKey = todayKey();
      const sortedEvents = sortEvents(events);
      const upcoming = sortedEvents.filter((e) => ddayInfo(e.date).diff >= 0);
      const headline = upcoming[0] || sortedEvents[0] || null;

      const cells = useMemo(() => {
        const first = new Date(view.y, view.m, 1);
        const startDay = first.getDay();
        const daysInMonth = new Date(view.y, view.m + 1, 0).getDate();
        const arr = [];
        for (let i = 0; i < startDay; i++) arr.push(null);
        for (let d = 1; d <= daysInMonth; d++) arr.push(new Date(view.y, view.m, d));
        while (arr.length % 7 !== 0) arr.push(null);
        return arr;
      }, [view]);

      const monthNet = useMemo(() => {
        let h = 0;
        Object.entries(plans).forEach(([k, v]) => { const [yy, mm] = k.split('-').map(Number); if (yy === view.y && mm === view.m + 1) { const s = daySummary(v); if (s) h += s.netH; } });
        return h;
      }, [plans, view]);

      const goMonth = (delta) => setView((v) => { const d = new Date(v.y, v.m + delta, 1); return { y: d.getFullYear(), m: d.getMonth() }; });

      return (
        <div className="animate-fadeIn">
          {/* D-day 배너: 가장 가까운 중요 일정 + 관리 버튼 */}
          <div className="mb-5">
            {headline ? (
              <button onClick={() => setDdOpen(true)} className="w-full text-left rounded-2xl bg-gradient-to-r from-stone-700 to-stone-600 text-white px-5 py-4 shadow-md hover:brightness-110 transition flex items-center gap-4">
                <span className="text-2xl">🎯</span>
                <div className="flex-1 min-w-0">
                  <div className="text-xs text-stone-300">{headline.name}</div>
                  <div className="text-sm text-stone-200">{ddayInfo(headline.date).pretty}</div>
                </div>
                <span className="text-2xl font-extrabold tabular-nums">{ddayInfo(headline.date).label}</span>
              </button>
            ) : (
              <button onClick={() => setDdOpen(true)} className="w-full rounded-2xl border-2 border-dashed border-stone-300 text-stone-400 px-5 py-4 hover:border-emerald-300 hover:text-emerald-500 transition text-sm">
                📌 수능·시험 일정을 등록하고 D-day를 확인하세요
              </button>
            )}
            {/* 다른 일정들 칩 */}
            {sortedEvents.length > 1 && (
              <div className="flex flex-wrap gap-1.5 mt-2">
                {sortedEvents.slice(1, 5).map((ev) => {
                  const info = ddayInfo(ev.date);
                  return <button key={ev.name + ev.date} onClick={() => setDdOpen(true)} className="text-xs bg-white border border-stone-200 rounded-full px-2.5 py-1 text-stone-500 hover:bg-stone-50">{ev.name} <span className="font-bold text-stone-600">{info.label}</span></button>;
                })}
              </div>
            )}
          </div>

          {/* 좌측 상단: 이 달 순공시간(부드러운 배지) · 우측: 교재등록 아이콘 */}
          <div className="flex items-center justify-between mb-6">
            <div className="flex items-center gap-2.5 rounded-2xl bg-white border border-stone-100 shadow-sm pl-3 pr-4 py-2.5">
              <span className="text-xl">🌱</span>
              <div className="leading-tight">
                <div className="text-[11px] text-stone-400">이 달 순공시간</div>
                <div className="text-lg font-bold" style={{ color: '#7C6F5B' }}>{fmtH(monthNet)}</div>
              </div>
            </div>
            <SoftButton onClick={() => setTbOpen(true)} title="과목별 교재등록"
              className="bg-white border border-stone-200 text-stone-600 hover:bg-stone-50 pl-3 pr-4 py-2.5 text-sm font-medium shadow-sm">
              <span className="text-lg mr-1.5">📒</span>교재등록
            </SoftButton>
          </div>

          {/* 월 이동 (격자 없는 미니멀, 오늘 버튼 없음) */}
          <div className="flex items-center justify-center gap-4 mb-5">
            <SoftButton onClick={() => goMonth(-1)} aria-label="이전 달" className="w-9 h-9 text-stone-400 hover:bg-stone-200/50 text-lg">‹</SoftButton>
            <h2 className="text-2xl font-extrabold text-stone-700 tracking-tight tabular-nums">{MONTH_LABEL(view.y, view.m)}</h2>
            <SoftButton onClick={() => goMonth(1)} aria-label="다음 달" className="w-9 h-9 text-stone-400 hover:bg-stone-200/50 text-lg">›</SoftButton>
          </div>

          <div className="grid grid-cols-7 mb-2">
            {WEEK_LABELS.map((w, i) => (
              <div key={w} className={`text-center text-xs font-medium ${i === 0 ? 'text-rose-300' : i === 6 ? 'text-indigo-300' : 'text-stone-400'}`}>{w}</div>
            ))}
          </div>

          {/* 격자선 없는 잔디 달력 */}
          <div className="grid grid-cols-7 gap-1.5 sm:gap-2">
            {cells.map((d, idx) => {
              if (!d) return <div key={idx} className="aspect-square" />;
              const key = toKey(d);
              const isToday = key === tKey;
              const sum = daySummary(plans[key]);
              const g = grass(sum ? sum.netH : 0);
              return (
                <button key={idx} onClick={() => onSelectDate(key)}
                  className={`aspect-square rounded-2xl flex flex-col items-center justify-center gap-0.5 transition hover:scale-[1.04] focus:outline-none
                    ${g.bg} ${isToday ? 'ring-2 ring-stone-400 shadow-md' : ''}`}>
                  <span className={`text-sm ${g.fg} ${isToday ? 'font-extrabold' : 'font-medium'}`}>{d.getDate()}</span>
                  {sum && sum.netH > 0 && <span className={`text-[9px] ${g.fg} opacity-80`}>{fmtH(sum.netH)}</span>}
                </button>
              );
            })}
          </div>

          <p className="text-center text-xs text-stone-400 mt-5">열공할수록 잔디가 진해져요 🌿 날짜를 눌러 계획을 적어보세요</p>

          {tbOpen && <TextbookPopup textbooks={textbooks} onSave={onSaveTextbooks} onClose={() => setTbOpen(false)} />}
          {ddOpen && <DdayPopup events={events || []} onSave={onSaveEvents} onClose={() => setDdOpen(false)} />}
        </div>
      );
    }

    // ========================================
    // 📄 하루 계획 (카드 + 서클 체크박스)
    // ========================================
    function formatDateTitle(key) {
      const [y, m, d] = key.split('-').map(Number);
      const date = new Date(y, m - 1, d);
      return `${m}월 ${d}일 ${WEEK_LABELS[date.getDay()]}요일`;
    }

    function PlanCard({ row, books, subjects, onToggle, onChange, onRemove }) {
      const done = row.status === '완료';
      const conf = row.subject ? subjConf(row.subject) : null;
      return (
        <div className={`rounded-2xl bg-white border border-stone-100 shadow-sm p-4 transition ${done ? 'opacity-70' : ''}`}>
          <div className="flex items-start gap-3">
            {/* 서클 체크박스 */}
            <button onClick={onToggle} aria-label="완료 체크"
              className={`mt-0.5 w-7 h-7 rounded-full border-2 flex items-center justify-center shrink-0 transition
                ${done ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-stone-300 text-transparent hover:border-emerald-400'}`}>
              <span className="text-sm leading-none">✓</span>
            </button>

            <div className="flex-1 min-w-0">
              {done ? (
                // 완료: 차분한 취소선 피드백
                <div>
                  <div className="flex items-center gap-2 flex-wrap">
                    <span className="text-xs text-stone-400 tabular-nums">{row.time || '시간 미정'}</span>
                    <span className="font-semibold text-stone-400 line-through">{conf ? conf.emoji + ' ' : ''}{row.subject || '과목'}</span>
                  </div>
                  {(row.textbook || row.goal) && (
                    <p className="text-sm text-stone-300 mt-1 line-through">{[row.textbook, row.goal].filter(Boolean).join('  ·  ')}</p>
                  )}
                </div>
              ) : (
                // 미완료: 인라인 편집
                <div className="space-y-2">
                  <div className="flex items-center gap-2 flex-wrap">
                    {conf && <span className={`w-2.5 h-2.5 rounded-full ${conf.dot}`}></span>}
                    <input type="text" value={row.time} onChange={(e) => onChange('time', e.target.value)} placeholder="09:00-10:00"
                      className="w-28 text-sm rounded-lg border border-stone-200 px-2.5 py-2 bg-stone-50 placeholder-stone-300 focus:outline-none focus:ring-2 focus:ring-emerald-200 focus:bg-white tabular-nums" />
                    <ComboSelect value={row.subject} options={subjects} onChange={(v) => onChange('subject', v)} emptyLabel="과목 선택" className="min-w-[7.5rem]" />
                  </div>
                  <div className="grid sm:grid-cols-2 gap-2">
                    <ComboSelect value={row.textbook} options={books} onChange={(v) => onChange('textbook', v)} emptyLabel={books.length ? '교재 선택' : '등록 교재 없음'} className="w-full" />
                    <input type="text" value={row.goal} onChange={(e) => onChange('goal', e.target.value)} placeholder="목표량 (예: 수학 20문제, 단어 50개)"
                      className="w-full text-sm rounded-lg border border-stone-200 px-3 py-2 bg-stone-50 placeholder-stone-300 focus:outline-none focus:ring-2 focus:ring-emerald-200 focus:bg-white" />
                  </div>
                  <input type="text" value={row.lacking} onChange={(e) => onChange('lacking', e.target.value)} placeholder="부족했던 점 (선택)"
                    className="w-full text-sm rounded-lg border border-stone-200 px-3 py-2 bg-stone-50 placeholder-stone-300 focus:outline-none focus:ring-2 focus:ring-emerald-200 focus:bg-white" />
                </div>
              )}
            </div>

            <button onClick={onRemove} title="삭제" className="shrink-0 w-7 h-7 rounded-full text-stone-300 hover:bg-rose-50 hover:text-rose-400">×</button>
          </div>
        </div>
      );
    }

    function DayPlanner({ dateKey, initialPlan, textbooks, onBack, onSaved }) {
      const [rows, setRows] = useState(() => buildDayRows(initialPlan));
      const [saveState, setSaveState] = useState('idle');
      const skip = useRef(true);

      // 변경 시 디바운스 자동 저장
      useEffect(() => {
        if (skip.current) { skip.current = false; return; }
        setSaveState('saving');
        const t = setTimeout(async () => {
          try {
            const res = await apiFetch(`/plans/${dateKey}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(rows) });
            if (!res.ok) throw new Error('status ' + res.status);
            onSaved(dateKey, rows); setSaveState('saved');
          } catch (e) { console.warn('자동 저장 실패:', e); setSaveState('error'); }
        }, 700);
        return () => clearTimeout(t);
      }, [rows, dateKey]);

      const change = (i, field, val) => setRows((prev) => prev.map((r, idx) => idx !== i ? r : (field === 'subject' ? { ...r, subject: val, textbook: '' } : { ...r, [field]: val })));
      const toggle = (i) => {
        const becomingDone = rows[i] && rows[i].status !== '완료';
        setRows((prev) => prev.map((r, idx) => idx !== i ? r : { ...r, status: r.status === '완료' ? '미정' : '완료' }));
        if (becomingDone) celebrate(); // 완료로 바뀔 때만 빵빠레
      };
      const addRow = () => setRows((prev) => [...prev, blankRow()]);
      const removeRow = (i) => setRows((prev) => (prev.length <= 1 ? prev : prev.filter((_, idx) => idx !== i)));

      const sum = daySummary(rows) || { planned: 0, done: 0, netH: 0 };
      const booksFor = (subject) => (textbooks && textbooks[subject]) || [];
      const subjectOptions = allSubjects(textbooks);

      return (
        <div className="animate-fadeIn max-w-2xl mx-auto">
          <div className="flex items-center justify-between mb-5">
            <SoftButton onClick={onBack} title="홈으로" className="bg-white border border-stone-200 text-stone-600 hover:bg-stone-50 shadow-sm pl-2.5 pr-3.5 py-1.5 text-sm">
              <span className="text-base mr-1">🏠</span>홈
            </SoftButton>
            <SaveIndicator state={saveState} />
          </div>

          <div className="mb-5">
            <h2 className="text-2xl font-extrabold text-stone-700 tracking-tight">{formatDateTitle(dateKey)}</h2>
            <p className="text-sm text-stone-400 mt-1">
              오늘 쌓은 시간 <span className="font-bold" style={{ color: '#5E8B6F' }}>🌿 {fmtH(sum.netH)}</span>
            </p>
          </div>

          <div className="space-y-3">
            {rows.map((r, i) => (
              <PlanCard key={i} row={r} books={booksFor(r.subject)} subjects={subjectOptions}
                onToggle={() => toggle(i)} onChange={(f, v) => change(i, f, v)} onRemove={() => removeRow(i)} />
            ))}
          </div>

          <SoftButton onClick={addRow} className="mt-4 w-full border-2 border-dashed border-stone-300 text-stone-400 hover:border-emerald-300 hover:text-emerald-500 py-3 text-sm">＋ 계획 추가</SoftButton>

          <p className="text-center text-xs text-stone-300 mt-5">동그라미를 누르면 완료 표시돼요 · 입력하면 자동 저장됩니다</p>
        </div>
      );
    }

    // ========================================
    // 🔐 로그인 / 회원가입 화면
    // ========================================
    function AuthScreen({ onAuth }) {
      const msg = useHourlyMessage();
      const [mode, setMode] = useState('login'); // 'login' | 'signup'
      const [username, setUsername] = useState('');
      const [pin, setPin] = useState('');
      const [err, setErr] = useState('');
      const [busy, setBusy] = useState(false);

      const submit = async () => {
        setErr('');
        if (!/^[A-Za-z][A-Za-z0-9]{2,19}$/.test(username)) { setErr('아이디는 영문으로 시작하는 영문/숫자 3~20자예요.'); return; }
        if (!/^\d{4}$/.test(pin)) { setErr('비밀번호는 숫자 4자리예요.'); return; }
        setBusy(true);
        try {
          const res = await fetch(`${API_BASE_URL}/auth`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: mode, username, pin }) });
          const data = await res.json().catch(() => ({}));
          if (!res.ok || !data.success) { setErr(data.message || '실패했어요. 다시 시도해 주세요.'); setBusy(false); return; }
          onAuth(data.username, data.token);
        } catch (e) { setErr('서버에 연결하지 못했어요.'); setBusy(false); }
      };

      return (
        <div className="min-h-screen flex items-center justify-center px-5">
          <div className="w-full max-w-sm animate-fadeIn">
            <div className="text-center mb-7">
              <div className="text-4xl mb-2">🌿</div>
              <h1 className="text-2xl font-extrabold text-stone-700 tracking-tight">스터디플래너</h1>
              <p className="text-stone-400 text-sm mt-1.5">{msg}</p>
            </div>

            <div className="bg-white rounded-3xl border border-stone-100 shadow-sm p-6">
              <div className="flex bg-stone-100 rounded-full p-1 mb-5 text-sm font-semibold">
                {['login', 'signup'].map((m) => (
                  <button key={m} onClick={() => { setMode(m); setErr(''); }}
                    className={`flex-1 py-2 rounded-full transition ${mode === m ? 'bg-white shadow text-stone-700' : 'text-stone-400'}`}>
                    {m === 'login' ? '로그인' : '회원가입'}
                  </button>
                ))}
              </div>

              <label className="block text-xs font-semibold text-stone-500 mb-1">아이디 <span className="font-normal text-stone-400">(영문)</span></label>
              <input type="text" value={username} autoCapitalize="none" autoCorrect="off"
                onChange={(e) => setUsername(e.target.value.replace(/[^A-Za-z0-9]/g, ''))}
                placeholder="예: minsu2026"
                className="w-full mb-4 text-sm rounded-xl border border-stone-200 px-3.5 py-3 bg-stone-50 placeholder-stone-300 focus:outline-none focus:ring-2 focus:ring-emerald-200 focus:bg-white" />

              <label className="block text-xs font-semibold text-stone-500 mb-1">비밀번호 <span className="font-normal text-stone-400">(숫자 4자리)</span></label>
              <input type="password" inputMode="numeric" value={pin} maxLength={4}
                onChange={(e) => setPin(e.target.value.replace(/\D/g, '').slice(0, 4))}
                onKeyDown={(e) => { if (e.key === 'Enter') submit(); }}
                placeholder="••••"
                className="w-full text-sm rounded-xl border border-stone-200 px-3.5 py-3 bg-stone-50 placeholder-stone-300 tracking-[0.4em] focus:outline-none focus:ring-2 focus:ring-emerald-200 focus:bg-white" />

              {err && <p className="text-rose-400 text-sm mt-3">{err}</p>}

              <button onClick={submit} disabled={busy}
                className="w-full mt-5 rounded-full bg-emerald-500 text-white font-semibold py-3 hover:bg-emerald-600 transition disabled:opacity-50">
                {busy ? '처리 중…' : (mode === 'login' ? '로그인' : '회원가입하고 시작하기')}
              </button>
            </div>
            <p className="text-center text-xs text-stone-300 mt-4">계정별로 나만의 계획·교재가 따로 저장돼요</p>
          </div>
        </div>
      );
    }

    // ========================================
    // 🚀 메인 (로그인 후)
    // ========================================
    function AppMain({ username, onLogout }) {
      const msg = useHourlyMessage();
      const [plans, setPlans] = useState({});
      const [textbooks, setTextbooks] = useState({});
      const [events, setEvents] = useState([]);
      const [loading, setLoading] = useState(true);
      const [loadError, setLoadError] = useState(false);
      const [selectedDate, setSelectedDate] = useState(null);

      useEffect(() => {
        let alive = true;
        Promise.all([
          apiFetch(`/plans`).then((r) => r.ok ? r.json() : {}),
          apiFetch(`/textbooks`).then((r) => r.ok ? r.json() : {}),
          apiFetch(`/events`).then((r) => r.ok ? r.json() : []),
        ])
          .then(([p, t, ev]) => { if (!alive) return; setPlans(p && typeof p === 'object' ? p : {}); setTextbooks(t && typeof t === 'object' ? t : {}); setEvents(Array.isArray(ev) ? ev : []); })
          .catch((e) => { console.warn('불러오기 실패:', e); if (alive) setLoadError(true); })
          .finally(() => { if (alive) setLoading(false); });
        return () => { alive = false; };
      }, []);

      const handleSaved = useCallback((dateKey, dayPlan) => { setPlans((prev) => ({ ...prev, [dateKey]: dayPlan })); }, []);
      const handleSaveTextbooks = useCallback((next) => { setTextbooks(next); }, []);
      const handleSaveEvents = useCallback((next) => { setEvents(Array.isArray(next) ? next : []); }, []);

      return (
        <div className="min-h-screen">
          <header className="max-w-3xl mx-auto px-5 pt-8 pb-2">
            <div className="flex items-start justify-between">
              <div>
                <div className="flex items-center gap-2 text-stone-700">
                  <span className="text-xl">🌿</span>
                  <h1 className="text-xl font-extrabold tracking-tight">스터디플래너</h1>
                </div>
                <p className="text-stone-400 text-sm mt-1.5">{username}님, {msg}</p>
              </div>
              <button onClick={onLogout} className="text-xs text-stone-400 hover:text-stone-600 border border-stone-200 rounded-full px-3 py-1.5 mt-1">로그아웃</button>
            </div>
          </header>

          <main className="max-w-3xl mx-auto px-5 py-6">
            {loadError && !selectedDate && (
              <div className="mb-4 text-sm bg-rose-50 border border-rose-100 text-rose-400 rounded-2xl px-4 py-3">
                데이터를 불러오지 못했어요. 잠시 후 다시 시도해 주세요.
              </div>
            )}
            {loading ? (
              <div className="text-center text-stone-300 py-24">불러오는 중…</div>
            ) : selectedDate ? (
              <DayPlanner key={selectedDate} dateKey={selectedDate} initialPlan={plans[selectedDate]}
                textbooks={textbooks} onBack={() => setSelectedDate(null)} onSaved={handleSaved} />
            ) : (
              <Calendar plans={plans} textbooks={textbooks} events={events} onSelectDate={setSelectedDate} onSaveTextbooks={handleSaveTextbooks} onSaveEvents={handleSaveEvents} />
            )}
          </main>
        </div>
      );
    }

    // ========================================
    // 🚀 App (인증 게이트)
    // ========================================
    function App() {
      const [session, setSession] = useState(() => ({
        token: localStorage.getItem('study-token'),
        username: localStorage.getItem('study-user'),
      }));

      const logout = useCallback(() => {
        localStorage.removeItem('study-token'); localStorage.removeItem('study-user');
        Auth.token = null;
        setSession({ token: null, username: null });
      }, []);

      useEffect(() => { Auth.onLogout = logout; }, [logout]);

      const handleAuth = (username, token) => {
        localStorage.setItem('study-token', token); localStorage.setItem('study-user', username);
        Auth.token = token;
        setSession({ token, username });
      };

      if (!session.token) return <AuthScreen onAuth={handleAuth} />;
      return <AppMain key={session.username} username={session.username} onLogout={logout} />;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
