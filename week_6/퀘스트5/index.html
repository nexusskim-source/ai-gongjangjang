<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>달콤 베이커리 🧁</title>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <!-- ⚠️ Babel standalone 은 반드시 7.23.5 로 고정한다. 최신(8.x)으로 올라가면
       type="text/babel" 인라인 변환이 깨져 빈 화면이 뜬다. -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.23.5/babel.min.js"></script>
  <!-- 토스페이먼츠 결제위젯 SDK v2 (standard) -->
  <script src="https://js.tosspayments.com/v2/standard"></script>
  <style>
    /* 파스텔 배경 그라데이션 + 부드러운 애니메이션 (Tailwind 로 표현하기 어려운 부분) */
    body {
      background:
        radial-gradient(1200px 600px at 10% -10%, #fdf0f4 0%, rgba(253,240,244,0) 60%),
        radial-gradient(1000px 500px at 100% 0%, #fff6ec 0%, rgba(255,246,236,0) 55%),
        #fffdf9;
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in-up { animation: fadeInUp 0.35s ease-out both; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .animate-spin-slow { animation: spin 0.8s linear infinite; }
    @keyframes popIn {
      0%   { opacity: 0; transform: translateY(12px) scale(0.96); }
      60%  { opacity: 1; transform: translateY(-2px) scale(1.01); }
      100% { transform: translateY(0) scale(1); }
    }
    .animate-pop-in { animation: popIn 0.28s ease-out both; }
    @keyframes badgePop {
      0% { transform: scale(0.5); }
      70% { transform: scale(1.25); }
      100% { transform: scale(1); }
    }
    .animate-badge-pop { animation: badgePop 0.3s ease-out; }
  </style>
</head>
<body class="text-stone-700">
  <div id="root"></div>

  <script type="text/babel">
    // ========================================
    // React Hooks
    // ========================================
    const { useState, useEffect, useMemo, useCallback, useRef } = React;

    // ========================================
    // 설정 (API) — 같은 오리진 상대경로 사용 (localhost 하드코딩 금지)
    // ========================================
    const API_BASE_URL = '/api';

    // 토스페이먼츠 클라이언트키 (공개키 — 프런트 노출 OK). 시크릿키는 서버 .env 에만 둔다.
    const TOSS_CLIENT_KEY = 'test_gck_docs_Ovk5rk1EwkEbP0W43n07xlzm';

    // ========================================
    // 🔐 인증 토큰 저장 (localStorage)
    // ========================================
    const TOKEN_KEY = 'bakery_token';
    const USER_KEY = 'bakery_user';
    const AVATAR_KEY = 'bakery_avatar';
    function loadAuth() {
      const token = localStorage.getItem(TOKEN_KEY);
      if (!token) return null;
      return {
        token,
        username: localStorage.getItem(USER_KEY) || '',
        profileImage: localStorage.getItem(AVATAR_KEY) || '',
      };
    }
    function saveAuth(token, username, profileImage) {
      localStorage.setItem(TOKEN_KEY, token);
      localStorage.setItem(USER_KEY, username || '');
      localStorage.setItem(AVATAR_KEY, profileImage || '');
    }
    function saveAvatar(profileImage) {
      localStorage.setItem(AVATAR_KEY, profileImage || '');
    }
    function clearAuth() {
      localStorage.removeItem(TOKEN_KEY);
      localStorage.removeItem(USER_KEY);
      localStorage.removeItem(AVATAR_KEY);
    }

    // ========================================
    // 🧮 유틸
    // ========================================
    // 천단위 콤마 + "원"
    function won(n) {
      const v = Number(n) || 0;
      return v.toLocaleString('ko-KR') + '원';
    }
    // ISO 날짜 → "2026.07.07 14:30" 형태 (구매내역 표시용)
    function formatDateTime(s) {
      if (!s) return '';
      const d = new Date(s);
      if (isNaN(d.getTime())) return '';
      const p = (n) => String(n).padStart(2, '0');
      return `${d.getFullYear()}.${p(d.getMonth() + 1)}.${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
    }
    // image 값이 이미지 경로(http URL 또는 / 로 시작하는 로컬 경로)인지 판별
    function isImageUrl(s) {
      return typeof s === 'string' && /^(https?:\/\/|\/)/i.test(s.trim());
    }

    // ========================================
    // 🎨 Design System Components
    // ========================================
    function Card({ children, className = '' }) {
      return (
        <div className={`rounded-3xl bg-white/90 shadow-[0_10px_30px_-12px_rgba(190,120,140,0.25)] ring-1 ring-rose-100/70 ${className}`}>
          {children}
        </div>
      );
    }

    function Button({ children, variant = 'primary', size = 'md', type = 'button', disabled, onClick, className = '' }) {
      const base = 'inline-flex items-center justify-center gap-1.5 font-bold transition active:scale-[0.97] focus:outline-none focus:ring-2 focus:ring-offset-1 disabled:opacity-60 disabled:cursor-not-allowed';
      const sizes = {
        sm: 'rounded-full px-3 py-1.5 text-xs',
        md: 'rounded-full px-4 py-2 text-sm',
        lg: 'rounded-full px-5 py-2.5 text-sm',
      };
      const variants = {
        primary: 'bg-gradient-to-r from-rose-400 to-pink-400 text-white shadow-md shadow-rose-200 hover:from-rose-500 hover:to-pink-500 focus:ring-rose-200',
        secondary: 'bg-white text-stone-600 ring-1 ring-inset ring-rose-200 hover:bg-rose-50 focus:ring-rose-200',
        danger: 'bg-white text-red-500 ring-1 ring-inset ring-red-200 hover:bg-red-50 focus:ring-red-200',
        ghost: 'text-stone-500 hover:bg-rose-50 focus:ring-rose-200',
        amber: 'bg-gradient-to-r from-amber-300 to-orange-300 text-amber-900 shadow-md shadow-amber-200 hover:from-amber-400 hover:to-orange-400 focus:ring-amber-200',
      };
      return (
        <button type={type} disabled={disabled} onClick={onClick}
          className={`${base} ${sizes[size]} ${variants[variant]} ${className}`}>
          {children}
        </button>
      );
    }

    const inputCls = 'w-full rounded-2xl border border-rose-200 bg-white px-4 py-2.5 text-sm text-stone-700 placeholder-stone-400 focus:border-rose-400 focus:outline-none focus:ring-2 focus:ring-rose-200';

    function Spinner({ label = '불러오는 중...' }) {
      return (
        <div className="flex flex-col items-center justify-center gap-3 py-24 text-stone-400" role="status" aria-live="polite">
          <div className="h-10 w-10 rounded-full border-4 border-rose-100 border-t-rose-400 animate-spin-slow" aria-hidden="true"></div>
          <p className="text-sm">{label}</p>
        </div>
      );
    }

    function ErrorState({ message, onRetry }) {
      return (
        <Card className="mx-auto max-w-md p-8 text-center">
          <div className="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-full bg-red-50 text-2xl" aria-hidden="true">😢</div>
          <h2 className="text-lg font-bold text-stone-700">문제가 발생했어요</h2>
          <p className="mt-2 break-words text-sm text-stone-500">{message}</p>
          {onRetry && <div className="mt-6"><Button onClick={onRetry} size="lg">다시 시도</Button></div>}
        </Card>
      );
    }

    // 상품 이미지 렌더: URL 이면 <img>, 아니면 큰 이모지를 파스텔 원 안에 렌더
    function ProductThumb({ image, name, className = '', imgClass = '', emojiSize = 'text-6xl' }) {
      const [broken, setBroken] = useState(false);
      const url = isImageUrl(image);
      if (url && !broken) {
        return (
          <div className={`flex items-center justify-center overflow-hidden bg-rose-50 ${className}`}>
            <img src={image.trim()} alt={name || '상품 이미지'} loading="lazy"
              onError={() => setBroken(true)}
              className={`h-full w-full object-cover ${imgClass}`} />
          </div>
        );
      }
      // 이모지(또는 깨진 URL 폴백): 문자 그대로 크게. 값이 없으면 기본 컵케이크.
      const emoji = (!url && typeof image === 'string' && image.trim()) ? image.trim() : '🧁';
      return (
        <div className={`flex items-center justify-center bg-gradient-to-br from-rose-50 to-amber-50 ${className}`} aria-hidden="true">
          <span className={emojiSize}>{emoji}</span>
        </div>
      );
    }

    // 토스트
    function Toast({ toast }) {
      if (!toast) return null;
      return (
        <div className="pointer-events-none fixed inset-x-0 top-20 z-50 flex justify-center px-4" aria-live="polite">
          <div className="animate-pop-in rounded-full bg-stone-800/90 px-5 py-2.5 text-sm font-semibold text-white shadow-lg">
            {toast}
          </div>
        </div>
      );
    }

    // ========================================
    // 🔐 로그인 / 회원가입 화면
    // ========================================
    function AuthView({ onAuthed, onBack, notice }) {
      const [mode, setMode] = useState('login'); // 'login' | 'signup'
      const [username, setUsername] = useState('');
      const [password, setPassword] = useState('');
      const [submitting, setSubmitting] = useState(false);
      const [err, setErr] = useState(null);
      const isLogin = mode === 'login';

      const switchMode = (m) => { setMode(m); setErr(null); };

      const submit = (e) => {
        e.preventDefault();
        setErr(null);
        const u = username.trim();
        if (!u || !password) { setErr('아이디와 비밀번호를 입력해 주세요.'); return; }
        if (!isLogin) {
          if (u.length < 3 || u.length > 30) { setErr('아이디는 3~30자로 입력해 주세요.'); return; }
          if (password.length < 4) { setErr('비밀번호는 4자 이상 입력해 주세요.'); return; }
        }
        setSubmitting(true);
        fetch(`${API_BASE_URL}/auth/${mode}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: u, password }),
        })
          .then((res) => res.json().then((data) => ({ ok: res.ok, status: res.status, data })))
          .then(({ ok, status, data }) => {
            if (!ok || !data.success) {
              if (status === 409) throw new Error(data.message || '이미 사용 중인 아이디입니다.');
              throw new Error(data.message || (isLogin ? '아이디 또는 비밀번호가 올바르지 않습니다.' : '회원가입에 실패했습니다.'));
            }
            saveAuth(data.token, data.username, data.profileImage);
            onAuthed({ token: data.token, username: data.username, profileImage: data.profileImage || '' });
          })
          .catch((e2) => setErr(e2.message))
          .finally(() => setSubmitting(false));
      };

      return (
        <div className="flex min-h-screen items-center justify-center px-4 py-10">
          <div className="w-full max-w-sm animate-fade-in-up">
            <button onClick={onBack} className="mb-4 inline-flex items-center gap-1 text-sm font-semibold text-stone-400 hover:text-stone-600">
              <span aria-hidden="true">←</span> 상품 구경하러 가기
            </button>

            <div className="mb-6 text-center">
              <div className="mx-auto mb-3 flex h-16 w-16 items-center justify-center rounded-3xl bg-gradient-to-br from-rose-300 to-amber-300 text-4xl shadow-lg shadow-rose-200" aria-hidden="true">🧁</div>
              <h1 className="text-2xl font-extrabold tracking-tight text-stone-800">달콤 베이커리</h1>
              <p className="mt-1 text-sm text-stone-500">로그인하고 달콤한 디저트를 담아보세요</p>
            </div>

            {notice && (
              <div className="mb-4 rounded-2xl bg-amber-50 px-4 py-3 text-center text-sm font-semibold text-amber-700 ring-1 ring-inset ring-amber-100">
                {notice}
              </div>
            )}

            <Card className="p-7">
              {/* 모드 전환 탭 */}
              <div className="mb-5 grid grid-cols-2 gap-1 rounded-full bg-rose-50 p-1">
                {[['login', '로그인'], ['signup', '회원가입']].map(([key, label]) => (
                  <button key={key} type="button" onClick={() => switchMode(key)}
                    className={`rounded-full py-2 text-sm font-bold transition ${
                      mode === key ? 'bg-white text-rose-500 shadow-sm' : 'text-stone-400 hover:text-stone-600'
                    }`}>
                    {label}
                  </button>
                ))}
              </div>

              <form onSubmit={submit} className="space-y-4">
                <div>
                  <label className="mb-1 block text-xs font-bold text-stone-500">아이디</label>
                  <input className={inputCls} value={username} onChange={(e) => setUsername(e.target.value)}
                    placeholder="아이디 (3~30자)" autoComplete="username" autoFocus />
                </div>
                <div>
                  <label className="mb-1 block text-xs font-bold text-stone-500">비밀번호</label>
                  <input type="password" className={inputCls} value={password} onChange={(e) => setPassword(e.target.value)}
                    placeholder="비밀번호 (4자 이상)" autoComplete={isLogin ? 'current-password' : 'new-password'} />
                </div>

                {err && (
                  <div className="rounded-2xl bg-red-50 px-4 py-2.5 text-sm text-red-500 ring-1 ring-inset ring-red-100">
                    {err}
                  </div>
                )}

                <Button type="submit" size="lg" disabled={submitting} className="w-full">
                  {submitting ? '처리 중...' : isLogin ? '로그인' : '회원가입'}
                </Button>
              </form>

              <p className="mt-5 text-center text-xs text-stone-400">
                아이디 3~30자 · 비밀번호 4자 이상
              </p>
            </Card>

            <p className="mt-5 text-center text-sm text-stone-500">
              {isLogin ? '아직 계정이 없나요? ' : '이미 계정이 있나요? '}
              <button type="button" onClick={() => switchMode(isLogin ? 'signup' : 'login')}
                className="font-bold text-rose-500 hover:underline">
                {isLogin ? '회원가입' : '로그인'}
              </button>
            </p>
          </div>
        </div>
      );
    }

    // ========================================
    // 🧩 상단바
    // ========================================
    // 👤 아바타: 프로필 사진이 있으면 이미지, 없으면 이름 첫 글자를 원 안에 표시
    function Avatar({ profileImage, username, size = 40 }) {
      const [broken, setBroken] = useState(false);
      const letter = (username || '?').trim().charAt(0).toUpperCase() || '?';
      const style = { width: size, height: size };
      if (profileImage && !broken) {
        return (
          <img src={profileImage} alt="프로필 사진" style={style}
            onError={() => setBroken(true)}
            className="rounded-full object-cover ring-2 ring-white shadow-sm" />
        );
      }
      return (
        <span style={style}
          className="flex items-center justify-center rounded-full bg-gradient-to-br from-rose-300 to-amber-300 font-extrabold text-white ring-2 ring-white shadow-sm"
          aria-hidden="true">
          {letter}
        </span>
      );
    }

    // 🖼️ 프로필 사진 변경 모달
    // 흐름: 파일 선택 → GET /api/imagekit-auth(서버 서명) → ImageKit 업로드 API 로 직접 업로드
    //       → 받은 URL 을 PUT /api/profile 로 저장 → 상단바 아바타 갱신.
    const IMAGEKIT_UPLOAD_URL = 'https://upload.imagekit.io/api/v1/files/upload';
    function ProfileModal({ auth, authFetch, onClose, onUpdated, showToast }) {
      const [preview, setPreview] = useState(auth.profileImage || '');
      const [busy, setBusy] = useState(false);
      const [err, setErr] = useState(null);
      const fileRef = useRef(null);

      const pickFile = () => { if (!busy && fileRef.current) fileRef.current.click(); };

      const handleFile = async (e) => {
        const file = e.target.files && e.target.files[0];
        e.target.value = ''; // 같은 파일 다시 선택 가능하게
        if (!file) return;
        if (!file.type.startsWith('image/')) { setErr('이미지 파일만 올릴 수 있어요.'); return; }
        if (file.size > 5 * 1024 * 1024) { setErr('5MB 이하 이미지만 올릴 수 있어요.'); return; }

        setErr(null);
        setBusy(true);
        const localUrl = URL.createObjectURL(file);
        setPreview(localUrl); // 업로드 중 미리보기
        try {
          // 1) 서버에서 업로드 서명 받기
          const authRes = await authFetch(`${API_BASE_URL}/imagekit-auth`);
          if (!authRes.ok) throw new Error('업로드 인증 정보를 받지 못했어요.');
          const sig = await authRes.json();

          // 2) ImageKit 업로드 API 로 직접 업로드 (multipart/form-data)
          const form = new FormData();
          form.append('file', file);
          form.append('fileName', `avatar_${auth.username || 'user'}_${Date.now()}`);
          form.append('folder', '/bakery-avatars');
          form.append('useUniqueFileName', 'true');
          form.append('publicKey', sig.publicKey);
          form.append('signature', sig.signature);
          form.append('expire', String(sig.expire));
          form.append('token', sig.token);

          const upRes = await fetch(IMAGEKIT_UPLOAD_URL, { method: 'POST', body: form });
          const upData = await upRes.json();
          if (!upRes.ok) {
            throw new Error((upData && upData.message) || '이미지 업로드에 실패했어요.');
          }
          const url = upData.url;

          // 3) 서버에 프로필 사진 URL 저장
          const saveRes = await authFetch(`${API_BASE_URL}/profile`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ profileImage: url }),
          });
          const saved = await saveRes.json();
          if (!saveRes.ok) throw new Error((saved && saved.message) || '저장에 실패했어요.');

          setPreview(saved.profileImage);
          onUpdated(saved.profileImage);
          showToast('프로필 사진을 바꿨어요! ✨');
        } catch (e2) {
          setErr((e2 && e2.message) || '문제가 생겼어요. 다시 시도해 주세요.');
          setPreview(auth.profileImage || ''); // 실패 시 원래대로
        } finally {
          URL.revokeObjectURL(localUrl);
          setBusy(false);
        }
      };

      const handleRemove = async () => {
        if (busy) return;
        setErr(null);
        setBusy(true);
        try {
          const saveRes = await authFetch(`${API_BASE_URL}/profile`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ profileImage: '' }),
          });
          const saved = await saveRes.json();
          if (!saveRes.ok) throw new Error((saved && saved.message) || '삭제에 실패했어요.');
          setPreview('');
          onUpdated('');
          showToast('프로필 사진을 지웠어요');
        } catch (e2) {
          setErr((e2 && e2.message) || '문제가 생겼어요. 다시 시도해 주세요.');
        } finally {
          setBusy(false);
        }
      };

      return (
        <div className="fixed inset-0 z-40 flex items-center justify-center bg-stone-900/40 p-4"
          onClick={onClose}>
          <div className="w-full max-w-sm rounded-3xl bg-white p-6 shadow-xl"
            onClick={(e) => e.stopPropagation()}>
            <div className="flex items-center justify-between">
              <h2 className="text-lg font-extrabold text-stone-800">내 프로필</h2>
              <button onClick={onClose} className="rounded-full p-1 text-stone-400 hover:bg-stone-100 hover:text-stone-600" aria-label="닫기">✕</button>
            </div>

            <div className="mt-5 flex flex-col items-center gap-3">
              <div className="relative">
                <Avatar profileImage={preview} username={auth.username} size={112} />
                {busy && (
                  <span className="absolute inset-0 flex items-center justify-center rounded-full bg-white/60 text-sm font-bold text-rose-500">
                    올리는 중…
                  </span>
                )}
              </div>
              <p className="text-sm text-stone-500">
                <span className="font-bold text-stone-800">{auth.username}</span> 님
              </p>
            </div>

            {err && <p className="mt-3 rounded-xl bg-rose-50 px-3 py-2 text-center text-sm text-rose-600">{err}</p>}

            <input ref={fileRef} type="file" accept="image/*" className="hidden" onChange={handleFile} />

            <div className="mt-5 flex flex-col gap-2">
              <Button onClick={pickFile} disabled={busy} className="w-full">
                {busy ? '처리 중…' : '📷 사진 변경'}
              </Button>
              {preview ? (
                <Button variant="secondary" onClick={handleRemove} disabled={busy} className="w-full">
                  사진 삭제
                </Button>
              ) : null}
            </div>
            <p className="mt-3 text-center text-xs text-stone-400">JPG·PNG·WEBP · 최대 5MB</p>
          </div>
        </div>
      );
    }

    function TopBar({ auth, isAdmin, cartCount, onHome, onCart, onLogin, onLogout, onProfile, onAdmin }) {
      const bump = useRef(false);
      // 배지 수량 변할 때 살짝 튀는 애니메이션 키
      const [animKey, setAnimKey] = useState(0);
      const prev = useRef(cartCount);
      useEffect(() => {
        if (cartCount !== prev.current) {
          prev.current = cartCount;
          setAnimKey((k) => k + 1);
        }
      }, [cartCount]);

      return (

    // ========================================
    // 💳 결제 화면 (토스페이먼츠 결제위젯)
    // ========================================
    // 흐름: 마운트 → 서버에 주문 생성(POST /api/orders, 서버가 금액 재계산)
    //       → 위젯 초기화/렌더(1회) → "결제하기" → widgets.requestPayment()
    //       → successUrl(=/?tossPayment=success) 로 리다이렉트
    function CheckoutView({ authFetch, onBack, showToast }) {
      const [phase, setPhase] = useState('loading'); // loading | ready | error | requesting
      const [order, setOrder] = useState(null);       // { orderId, amount, orderName, customerKey }
      const [error, setError] = useState(null);
      const widgetsRef = useRef(null);
      const renderedRef = useRef(false);

      useEffect(() => {
        let cancelled = false;
        (async () => {
          try {
            // 1) 서버가 장바구니 기준으로 금액을 재계산해 주문 생성
            const res = await authFetch(`${API_BASE_URL}/orders`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({}),
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(data.message || `주문 생성 실패 (HTTP ${res.status})`);
            if (cancelled) return;
            setOrder(data);

            // 2) 결제위젯 초기화 (SDK 로드 확인)
            if (typeof TossPayments === 'undefined') {
              throw new Error('결제 모듈을 불러오지 못했어요. 새로고침 후 다시 시도해 주세요.');
            }
            const tossPayments = TossPayments(TOSS_CLIENT_KEY);
            const widgets = tossPayments.widgets({ customerKey: data.customerKey });
            widgetsRef.current = widgets;

            // 3) 금액 설정 후 위젯 렌더 (페이지당 1회만)
            await widgets.setAmount({ currency: 'KRW', value: data.amount });
            if (!renderedRef.current) {
              await widgets.renderPaymentMethods({ selector: '#toss-payment-method', variantKey: 'DEFAULT' });
              await widgets.renderAgreement({ selector: '#toss-agreement', variantKey: 'AGREEMENT' });
              renderedRef.current = true;
            }
            if (!cancelled) setPhase('ready');
          } catch (e) {
            if (!cancelled) { setError(e.message || '결제 준비 중 오류가 발생했어요.'); setPhase('error'); }
          }
        })();
        return () => { cancelled = true; };
      }, []); // 마운트 시 1회

      const requestPayment = useCallback(async () => {
        if (!widgetsRef.current || !order) return;
        setPhase('requesting');
        try {
          await widgetsRef.current.requestPayment({
            orderId: order.orderId,
            orderName: order.orderName,
            successUrl: window.location.origin + '/?tossPayment=success',
            failUrl: window.location.origin + '/?tossPayment=fail',
          });
          // 정상 흐름에서는 successUrl 로 리다이렉트되어 아래 코드는 실행되지 않음
        } catch (e) {
          setPhase('ready');
          if (e && e.code === 'USER_CANCEL') showToast('결제를 취소했어요');
          else showToast((e && e.message) || '결제 요청에 실패했어요 😢');
        }
      }, [order, showToast]);

      return (
        <div className="animate-fade-in-up">
          <div className="mb-5 flex items-end justify-between gap-3">
            <div>
              <h1 className="text-2xl font-extrabold tracking-tight text-stone-800">💳 결제하기</h1>
              <p className="mt-1 text-sm text-stone-500">
                {order ? order.orderName : '주문서를 준비하고 있어요'}
              </p>
            </div>
            <Button variant="secondary" size="lg" onClick={onBack}>← 장바구니로</Button>
          </div>

          {phase === 'error' ? (
            <ErrorState message={error} onRetry={onBack} />
          ) : (
            <div className="grid grid-cols-1 gap-5 lg:grid-cols-3">
              {/* 결제 수단 + 약관 위젯 (선택자 div 는 항상 존재해야 렌더 가능) */}
              <div className="lg:col-span-2">
                <Card className="relative overflow-hidden p-2 sm:p-4">
                  {phase === 'loading' && (
                    <div className="absolute inset-0 z-10 flex items-center justify-center bg-white/70 backdrop-blur-sm">
                      <Spinner label="결제 수단을 불러오는 중..." />
                    </div>
                  )}
                  <div id="toss-payment-method"></div>
                  <div id="toss-agreement"></div>
                </Card>
              </div>

              {/* 결제 요약 */}
              <div className="lg:col-span-1">
                <Card className="p-6 lg:sticky lg:top-24">
                  <h2 className="text-base font-extrabold text-stone-800">결제 금액</h2>
                  <div className="mt-4 flex items-center justify-between border-t border-rose-100 pt-4">
                    <span className="text-sm font-bold text-stone-600">총 결제금액</span>
                    <span className="text-2xl font-extrabold text-rose-500">
                      {order ? won(order.amount) : '—'}
                    </span>
                  </div>
                  <div className="mt-6">
                    <Button variant="amber" size="lg" className="w-full"
                      disabled={phase !== 'ready'} onClick={requestPayment}>
                      {phase === 'requesting' ? '결제창 여는 중...' : phase === 'ready' ? '💳 결제하기' : '준비 중...'}
                    </Button>
                  </div>
                  <p className="mt-3 text-center text-xs text-stone-400">
                    테스트 결제라 실제 금액은 청구되지 않아요 🧁
                  </p>
                </Card>
              </div>
            </div>
          )}
        </div>
      );
    }

    function PaymentResultView({ result, onHome, onRetry }) {

            <h2 className="text-lg font-extrabold text-stone-800">

            {success ? (
              <div className="mt-4 space-y-2 rounded-2xl bg-rose-50/60 p-4 text-left text-sm">

                {result.alreadyProcessed && <p className="pt-1 text-center text-xs text-stone-400">이미 처리된 결제예요</p>}
              </div>
            ) : (
              <p className="mt-3 break-words text-sm text-stone-500">
                {result.message || '결제가 정상적으로 처리되지 않았습니다.'}

        </div>
      );

    // ========================================
    // 🚀 App — state 기반 뷰 전환 (list / auth / cart / checkout / paymentResult)
    // ========================================
    // ========================================
    // 🙋 마이페이지 (프로필 + 구매내역)
    // ========================================
    function MyPageView({ auth, authFetch, showToast, onChangePhoto, onShop }) {
      const [orders, setOrders] = useState(null); // null=로딩전, []=없음
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);

      const loadOrders = useCallback(() => {
        setLoading(true);
        setError(null);
        authFetch(`${API_BASE_URL}/orders`)
          .then((res) => {
            if (!res.ok) throw new Error(`서버 응답 오류 (HTTP ${res.status})`);
            return res.json();
          })
          .then((data) => setOrders((data && data.orders) || []))
          .catch((e) => setError(e.message))
          .finally(() => setLoading(false));
      }, [authFetch]);

      useEffect(() => { loadOrders(); }, [loadOrders]);

      const totalSpent = useMemo(

    // ========================================

    // 시간대에 맞는 인사말
    function greetingByHour() {
      const h = new Date().getHours();
      if (h < 11) return '좋은 아침';
      if (h < 17) return '좋은 오후';
      return '좋은 저녁';
    }

    // 만원 단위 축약 (차트 라벨용)
    function manwon(n) {
      return Math.round((Number(n) || 0) / 10000) + '만';
    }

    // 증감률 배지 (+12% 초록 / -8% 빨강)
    function DeltaBadge({ pct, className = '' }) {
      if (pct == null) return null;
      const up = pct >= 0;
      return (
        <span className={`inline-flex items-center gap-0.5 rounded-full px-2 py-0.5 text-xs font-bold ${up ? 'bg-emerald-50 text-emerald-600' : 'bg-red-50 text-red-500'} ${className}`}>
          {up ? '▲' : '▼'} {Math.abs(pct)}%
        </span>
      );
    }

    // 위젯 공통 껍데기 (제목 + 데이터 출처 태그)
    function Widget({ title, tag, right, children, className = '' }) {
      return (
        <Card className={`flex flex-col p-5 ${className}`}>
          <div className="mb-4 flex items-center justify-between gap-2">
            <div className="flex items-center gap-2">
              <h3 className="text-base font-extrabold text-stone-800">{title}</h3>
              {tag && (
                <span className="rounded-full bg-stone-100 px-2 py-0.5 text-[11px] font-bold text-stone-500">{tag}</span>
              )}
            </div>
            {right}
          </div>
          <div className="flex-1">{children}</div>
        </Card>
      );
    }

    // 상단 KPI 4칸 (최근 영업일 기준)

      const d = dash.latestDay;
      const items = [
        { label: '최근 영업일 매출', value: won(d.revenue), sub: `${d.date} (${d.weekday}) · ${d.weather}`, delta: d.changePct, icon: '💰' },
        { label: '손님 수', value: `${d.visitors}명`, sub: `주문 ${d.orderCount}건`, icon: '🙋' },

      return (
        <div className="grid grid-cols-2 gap-3 lg:grid-cols-4">

            <Card key={it.label} className="p-4">

                <p className="text-xs font-bold text-stone-400">{it.label}</p>
                <span aria-hidden="true">{it.icon}</span>
              </div>
              <div className="mt-1 flex items-baseline gap-1.5">
                <p className="text-xl font-extrabold text-stone-800">{it.value}</p>
                <DeltaBadge pct={it.delta} />
              </div>
              <p className="mt-1 truncate text-[11px] text-stone-400">{it.sub}</p>
            </Card>
          ))}
        </div>

    // 오늘 할 일 (Supabase shop_admin_todos)
    function TodoWidget({ todos, onAdd, onToggle, onRemove, busy }) {
      const [text, setText] = useState('');
      const submit = (e) => {
        e.preventDefault();
        const v = text.trim();
        if (!v) return;
        onAdd(v);
        setText('');
      };
      const doneCount = todos.filter((t) => t.done).length;
      return (
        <Widget title="오늘 할 일" tag="DB 연동" right={<span className="text-xs font-bold text-stone-400">{doneCount}/{todos.length} 완료</span>}>
          <ul className="space-y-1">
            {todos.length === 0 && <li className="py-6 text-center text-sm text-stone-400">할 일이 없어요. 오늘은 여유롭네요 ☕</li>}
            {todos.map((t) => (
              <li key={t.id} className="group flex items-center gap-2 rounded-xl px-2 py-1.5 transition hover:bg-rose-50/70">
                <input
                  type="checkbox"
                  checked={t.done}
                  disabled={busy}
                  onChange={() => onToggle(t.id)}
                  className="h-4 w-4 shrink-0 cursor-pointer rounded border-stone-300 text-rose-500 focus:ring-rose-300"
                  aria-label={`${t.content} 완료 표시`}
                />
                <span className={`flex-1 text-sm ${t.done ? 'text-stone-400 line-through' : 'text-stone-700'}`}>{t.content}</span>
                <button
                  onClick={() => onRemove(t.id)}
                  disabled={busy}
                  className="opacity-0 transition group-hover:opacity-100 focus:opacity-100 text-xs text-stone-400 hover:text-red-500"
                  aria-label={`${t.content} 삭제`}>
                  ✕
                </button>
              </li>
            ))}
          </ul>
          <form onSubmit={submit} className="mt-3 flex gap-2">
            <input
              value={text}
              onChange={(e) => setText(e.target.value)}
              placeholder="할 일 추가..."
              maxLength={120}
              className={`${inputCls} py-2 text-sm`}
            />
            <Button type="submit" size="sm" disabled={busy || !text.trim()}>추가</Button>
          </form>
        </Widget>
      );
    }

    // AI 브리핑

          }
          className="bg-gradient-to-br from-amber-50/90 to-rose-50/90">
          {loading && (
            <div className="space-y-2 py-2" aria-live="polite">
              <div className="h-3 w-11/12 animate-pulse rounded bg-amber-100"></div>
              <div className="h-3 w-9/12 animate-pulse rounded bg-amber-100"></div>
              <div className="h-3 w-10/12 animate-pulse rounded bg-amber-100"></div>
              <p className="pt-2 text-xs text-stone-400">카페 데이터를 종합해 브리핑을 쓰는 중...</p>
            </div>
          )}
          {!loading && error && <p className="text-sm text-red-500">{error}</p>}
          {!loading && !error && briefing && (
            <div>
              <div className="space-y-1.5 text-sm leading-relaxed text-stone-700">

                  <p key={i}>{line}</p>
                ))}

                {briefing.forecast && (

                {briefing.warning && <span className="text-amber-600">{briefing.warning}</span>}
              </div>
            </div>
          )}

    // 이번 주 매출 (일별 막대)

          right={

              <DeltaBadge pct={week.changePct} />
              <span className="ml-1 text-[11px] text-stone-400">지난주 대비</span>

          }>

            {week.days.map((d) => (

                <div className="h-6 flex-1 overflow-hidden rounded-full bg-rose-50">

                    className={`flex h-full items-center justify-end rounded-full pr-2 text-[10px] font-bold text-white ${d.isClosed ? 'bg-stone-200' : 'bg-gradient-to-r from-rose-300 to-pink-400'}`}
                    style={{ width: `${Math.max((d.revenue / max) * 100, d.revenue ? 12 : 0)}%` }}>

                  {d.isClosed ? '휴무' : `${d.visitors}명`}

    // 인기 메뉴 TOP3 (최근 7일 판매량)

    // 발주 필요 재고 + 최근 리뷰
    function RestockWidget({ restock }) {

        <Widget title="발주 필요 재고" tag="DB 연동" right={<span className="text-xs font-bold text-stone-400">{restock.length}건</span>}>
          {restock.length === 0 ? (

    function RecentReviewWidget({ reviews }) {
      return (
        <Widget
          title="최근 리뷰"
          tag="DB 연동"
          right={reviews.avgRating != null && <span className="text-xs font-bold text-amber-500">★ {reviews.avgRating}</span>}>
          <ul className="space-y-2.5">
            {reviews.recent.map((r, i) => (
              <li key={i} className="rounded-xl bg-stone-50 px-3 py-2">
                <div className="flex items-center gap-1.5 text-[11px] text-stone-400">

    function AdminDashboardView({ auth, authFetch, showToast, onShop }) {
      const [dash, setDash] = useState(null);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);
      const [todoBusy, setTodoBusy] = useState(false);

      const [briefing, setBriefing] = useState(null);
      const [briefLoading, setBriefLoading] = useState(true);
      const [briefError, setBriefError] = useState(null);

      // 대시보드 데이터
      const load = useCallback(() => {
        setLoading(true);
        setError(null);
        authFetch(`${API_BASE_URL}/admin/dashboard`)
          .then((res) => res.json().then((data) => ({ ok: res.ok, data })))
          .then(({ ok, data }) => {
            if (!ok) throw new Error(data.message || '대시보드를 불러오지 못했어요.');
            setDash(data);
          })
          .catch((e) => setError(e.message))
          .finally(() => setLoading(false));
      }, [authFetch]);

      // AI 브리핑
      const loadBriefing = useCallback(() => {
        setBriefLoading(true);
        setBriefError(null);
        authFetch(`${API_BASE_URL}/admin/briefing`, { method: 'POST' })
          .then((res) => res.json().then((data) => ({ ok: res.ok, data })))
          .then(({ ok, data }) => {
            if (!ok) throw new Error(data.message || '브리핑 생성에 실패했어요.');
            setBriefing(data);
          })
          .catch((e) => setBriefError(e.message))
          .finally(() => setBriefLoading(false));
      }, [authFetch]);

      useEffect(() => {
        load();
        loadBriefing();
      }, [load, loadBriefing]);

      // 할 일 CRUD — 응답이 곧 최신 목록
      const todoReq = useCallback((method, body) => {
        setTodoBusy(true);
        authFetch(`${API_BASE_URL}/admin/todos`, {
          method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        })
          .then((res) => res.json().then((data) => ({ ok: res.ok, data })))
          .then(({ ok, data }) => {
            if (!ok) throw new Error(data.message || '할 일 저장에 실패했어요.');
            setDash((d) => (d ? { ...d, todos: data } : d));
          })
          .catch((e) => showToast(e.message))
          .finally(() => setTodoBusy(false));
      }, [authFetch, showToast]);

      if (loading) return <Spinner label="사장님 대시보드를 여는 중..." />;
      if (error) return <ErrorState message={error} onRetry={load} />;
      if (!dash) return null;

      return (
        <div className="animate-fade-in-up space-y-4">
          {/* 헤더: 인사 + 기준일 */}
          <div className="flex flex-wrap items-end justify-between gap-3">
            <div>
              <h1 className="text-2xl font-extrabold text-stone-800">
                {greetingByHour()}, {dash.cafeName.split(' (')[0]} 카페 사장님! 👑
              </h1>
              <p className="mt-1 text-sm text-stone-500">
                {new Date().toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' })}
                <span className="mx-1.5 text-stone-300">|</span>
                데이터 기준일 {dash.latestDate}
              </p>
            </div>
            <div className="flex gap-2">
              <Button variant="secondary" size="sm" onClick={load}>새로고침</Button>
              <Button variant="secondary" size="sm" onClick={onShop}>쇼핑몰 보기 🧁</Button>
            </div>
          </div>

          <KpiRow dash={dash} />

          <div className="grid gap-4 lg:grid-cols-2">
            <TodoWidget
              todos={dash.todos}
              busy={todoBusy}
              onAdd={(content) => todoReq('POST', { content })}
              onToggle={(id) => todoReq('PUT', { id })}
              onRemove={(id) => todoReq('DELETE', { id })}
            />
            <BriefingWidget briefing={briefing} loading={briefLoading} error={briefError} onRefresh={loadBriefing} />
            <WeekSalesWidget week={dash.week} />
            <TopMenuWidget topMenus={dash.topMenus} />
            <RestockWidget restock={dash.restock} />
            <RecentReviewWidget reviews={dash.reviews} />
          </div>
        </div>
      );
    }

    function App() {
      const [auth, setAuth] = useState(loadAuth);
      const [view, setView] = useState('list'); // 'list' | 'auth' | 'cart' | 'checkout' | 'paymentResult' | 'mypage' | 'admin'
      const [authNotice, setAuthNotice] = useState(null); // 로그인 유도 안내 문구
      const [paymentResult, setPaymentResult] = useState(null); // { status, ... }
      const [profileOpen, setProfileOpen] = useState(false); // 프로필 모달 열림

      // 프로필 사진 갱신 (모달에서 업로드/삭제 성공 시 호출)
      const updateAvatar = useCallback((url) => {
        saveAvatar(url);
        setAuth((a) => (a ? { ...a, profileImage: url || '' } : a));
      }, []);

      // 장바구니 상태
      const [cart, setCart] = useState(null);
      const [cartLoading, setCartLoading] = useState(false);
      const [cartError, setCartError] = useState(null);
      const [cartBusy, setCartBusy] = useState(false);
      const [addingId, setAddingId] = useState(null);

      // 토스트
      const [toast, setToast] = useState(null);
      const toastTimer = useRef(null);
      const showToast = useCallback((msg) => {
        setToast(msg);
        if (toastTimer.current) clearTimeout(toastTimer.current);
        toastTimer.current = setTimeout(() => setToast(null), 2000);
      }, []);
      useEffect(() => () => { if (toastTimer.current) clearTimeout(toastTimer.current); }, []);

      // 담긴 총 개수 (배지)
      const cartCount = useMemo(() => {
        if (!cart || !Array.isArray(cart.items)) return 0;
        return cart.items.reduce((s, it) => s + (Number(it.quantity) || 0), 0);
      }, [cart]);

      // 로그아웃 (401 포함)
      const handleLogout = useCallback((silent) => {
        clearAuth();
        setAuth(null);
        setCart(null);
        setView('list');
        if (!silent) showToast('로그아웃 되었어요 👋');
      }, [showToast]);

      // 인증 실은 fetch. 401 이면 세션 만료 → 로그아웃.
      const authFetch = useCallback((path, opts = {}) => {
        const token = auth ? auth.token : null;
        const headers = Object.assign({}, opts.headers, token ? { Authorization: `Bearer ${token}` } : {});
        return fetch(path, Object.assign({}, opts, { headers })).then((res) => {
          if (res.status === 401) {
            handleLogout(true);
            setAuthNotice('세션이 만료되었어요. 다시 로그인해 주세요.');
            setView('auth');
            throw new Error('세션이 만료되었습니다. 다시 로그인해 주세요.');
          }
          return res;
        });
      }, [auth, handleLogout]);

      // 장바구니 조회
      const fetchCart = useCallback(() => {
        if (!auth) return;
        setCartLoading(true);
        setCartError(null);
        authFetch(`${API_BASE_URL}/cart`)
          .then((res) => {
            if (!res.ok) throw new Error(`서버 응답 오류 (HTTP ${res.status})`);
            return res.json();
          })
          .then((data) => setCart({ items: (data && data.items) || [], total: (data && data.total) || 0 }))
          .catch((e) => setCartError(e.message))
          .finally(() => setCartLoading(false));
      }, [auth, authFetch]);

      // 로그인되면 장바구니 미리 불러오기 (배지 표시용)
      useEffect(() => {
        if (auth) fetchCart();
      }, [auth]); // eslint-disable-line

      // 결제 리다이렉트 감지 (successUrl=/?tossPayment=success, failUrl=/?tossPayment=fail)
      // 해시 라우팅이 아니라 루트(/) + location.search 를 쓰므로 파싱이 단순하다.
      useEffect(() => {
        const params = new URLSearchParams(window.location.search);
        const kind = params.get('tossPayment');
        if (!kind) return;

        if (kind === 'success') {
          const paymentKey = params.get('paymentKey');
          const orderId = params.get('orderId');
          const amount = params.get('amount');
          // 새로고침 시 재승인/민감정보 노출 방지를 위해 URL 을 즉시 정리
          window.history.replaceState({}, '', window.location.pathname);
          setView('paymentResult');
          setPaymentResult({ status: 'confirming' });

          if (!paymentKey || !orderId || !amount) {
            setPaymentResult({ status: 'fail', message: '결제 정보가 올바르지 않습니다.' });
            return;
          }
          authFetch(`${API_BASE_URL}/payments/confirm`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ paymentKey, orderId, amount }),
          })
            .then((res) => res.json().then((data) => ({ ok: res.ok, data })))
            .then(({ ok, data }) => {
              if (!ok || !data.success) throw new Error(data.message || '결제 승인에 실패했습니다.');
              setPaymentResult({ status: 'success', ...data });
              fetchCart(); // 승인 성공 시 장바구니는 서버에서 비워짐 → 배지 갱신
            })
            .catch((e) => setPaymentResult({ status: 'fail', message: e.message }));
        } else {
          // 실패 리다이렉트: code/message/orderId 가 location.search 에 담겨 옴
          const code = params.get('code');
          const message = params.get('message');
          window.history.replaceState({}, '', window.location.pathname);
          setView('paymentResult');
          setPaymentResult({ status: 'fail', code, message: message || '결제가 취소되었거나 실패했습니다.' });
        }
      }, []); // eslint-disable-line  (마운트 시 1회)

      // 사장님(admin) 여부 — 대시보드 진입 버튼 노출용.
      // 실제 접근 통제는 서버(/api/admin/*)가 DB 로 다시 확인한다.
      const isAdmin = !!auth && auth.username === 'admin';

      // 인증 성공. 사장님이면 바로 대시보드로 보낸다.
      const handleAuthed = useCallback((a) => {
        setAuth(a);
        setAuthNotice(null);
        const admin = a.username === 'admin';
        setView(admin ? 'admin' : 'list');
        showToast(admin ? '사장님, 어서 오세요! 👑' : `${a.username}님, 환영해요! 🎉`);
      }, [showToast]);

      // 로그인 유도
      const requireLogin = useCallback((notice) => {
        setAuthNotice(notice || '로그인이 필요한 기능이에요.');
        setView('auth');
        window.scrollTo(0, 0);
      }, []);

      // 장바구니 담기
      const handleAdd = useCallback((product) => {
        if (!auth) {
          requireLogin('장바구니에 담으려면 로그인해 주세요 🧁');
          return;
        }
        setAddingId(product.id);
        authFetch(`${API_BASE_URL}/cart`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ productId: product.id, quantity: 1 }),
        })
          .then((res) => {
            if (!res.ok) throw new Error(`담기에 실패했어요 (HTTP ${res.status})`);
            return res.json();
          })
          .then((data) => {
            setCart({ items: (data && data.items) || [], total: (data && data.total) || 0 });
            showToast(`${product.name} 담았어요! 🛒`);
          })
          .catch((e) => showToast(e.message || '담기에 실패했어요 😢'))
          .finally(() => setAddingId(null));
      }, [auth, authFetch, requireLogin, showToast]);

      // 장바구니 열기
      const openCart = useCallback(() => {
        if (!auth) {
          requireLogin('장바구니를 보려면 로그인해 주세요 🛒');
          return;
        }
        setView('cart');
        window.scrollTo(0, 0);
        fetchCart();
      }, [auth, requireLogin, fetchCart]);

      // 결제 화면 열기
      const openCheckout = useCallback(() => {
        if (!auth) { requireLogin('결제하려면 로그인해 주세요 💳'); return; }
        setView('checkout');
        window.scrollTo(0, 0);
      }, [auth, requireLogin]);

      // 수량 변경 (PUT) — 0 이하면 백엔드에서 삭제 처리
      const handleQty = useCallback((productId, quantity) => {
        setCartBusy(true);
        authFetch(`${API_BASE_URL}/cart`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ productId, quantity }),
        })
          .then((res) => {
            if (!res.ok) throw new Error(`수량 변경 실패 (HTTP ${res.status})`);
            return res.json();
          })
          .then((data) => setCart({ items: (data && data.items) || [], total: (data && data.total) || 0 }))
          .catch((e) => showToast(e.message || '수량 변경 실패 😢'))
          .finally(() => setCartBusy(false));
      }, [authFetch, showToast]);

      // 삭제 (DELETE)
      const handleRemove = useCallback((productId) => {
        setCartBusy(true);
        authFetch(`${API_BASE_URL}/cart`, {
          method: 'DELETE',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ productId }),
        })
          .then((res) => {
            if (!res.ok) throw new Error(`삭제 실패 (HTTP ${res.status})`);
            return res.json();
          })
          .then((data) => {
            setCart({ items: (data && data.items) || [], total: (data && data.total) || 0 });
            showToast('상품을 삭제했어요');
          })
          .catch((e) => showToast(e.message || '삭제 실패 😢'))
          .finally(() => setCartBusy(false));
      }, [authFetch, showToast]);

      const goHome = () => { setView('list'); window.scrollTo(0, 0); };

      // 로그인 화면은 전체 화면(상단바 없이)
      if (view === 'auth') {
        return (
          <div className="min-h-screen">
            <Toast toast={toast} />
            <AuthView onAuthed={handleAuthed} onBack={goHome} notice={authNotice} />
          </div>
        );
      }

      return (
        <div className="min-h-screen">
          <Toast toast={toast} />
          <TopBar
            auth={auth}
            isAdmin={isAdmin}
            cartCount={cartCount}
            onHome={goHome}
            onCart={openCart}
            onLogin={() => requireLogin(null)}
            onLogout={() => handleLogout(false)}
            onProfile={() => { setView('mypage'); window.scrollTo(0, 0); }}
            onAdmin={() => { setView('admin'); window.scrollTo(0, 0); }}
          />

          {profileOpen && auth && (
            <ProfileModal
              auth={auth}
              authFetch={authFetch}
              onClose={() => setProfileOpen(false)}
              onUpdated={updateAvatar}
              showToast={showToast}
            />
          )}

          <main className="mx-auto max-w-6xl px-4 py-8 sm:px-6">
            {view === 'list' && (
              <ProductListView onAdd={handleAdd} addingId={addingId} />
            )}
            {view === 'cart' && (
              <CartView
                cart={cart}
                loading={cartLoading}
                error={cartError}
                busy={cartBusy}
                onQty={handleQty}
                onRemove={handleRemove}
                onContinue={goHome}
                onRetry={fetchCart}
                onCheckout={openCheckout}
              />
            )}
            {view === 'checkout' && (
              <CheckoutView
                authFetch={authFetch}
                onBack={() => { setView('cart'); window.scrollTo(0, 0); }}
                showToast={showToast}
              />
            )}
            {view === 'paymentResult' && (
              <PaymentResultView
                result={paymentResult}
                onHome={() => { setPaymentResult(null); goHome(); }}
                onRetry={() => { setPaymentResult(null); openCart(); }}
              />
            )}
            {view === 'mypage' && auth && (
              <MyPageView
                auth={auth}
                authFetch={authFetch}
                showToast={showToast}
                onChangePhoto={() => setProfileOpen(true)}
                onShop={goHome}
              />
            )}
            {view === 'admin' && (
              isAdmin ? (
                <AdminDashboardView
                  auth={auth}
                  authFetch={authFetch}
                  showToast={showToast}
                  onShop={goHome}
                />
              ) : (
                <ErrorState
                  message="사장님(admin) 계정만 볼 수 있는 페이지예요. 🔒"
                  onRetry={goHome}
                />
              )
            )}
          </main>

          <footer className="mx-auto max-w-6xl px-4 py-10 text-center text-xs text-stone-400 sm:px-6">
            🧁 달콤 베이커리 · React + Tailwind 단일 파일 앱
          </footer>
        </div>
      );
    }

    // ========================================
    // Rendering
    // ========================================
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
