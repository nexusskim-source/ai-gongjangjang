<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BMI 비만도 측정기</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gradient-to-br from-slate-100 to-slate-200 min-h-screen">
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;

    // ========================================
    // 🎨 Design System Components
    // ========================================
    function Input({ label, unit, value, onChange, placeholder }) {
      return (
        <div className="w-full">
          <label className="block text-sm font-semibold text-slate-700 mb-1.5">{label}</label>
          <div className="relative">
            <input
              type="number"
              inputMode="decimal"
              value={value}
              onChange={onChange}
              placeholder={placeholder}
              className="w-full px-4 py-3 pr-12 rounded-xl border border-slate-300 bg-white text-lg text-slate-800
                         focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition"
            />
            <span className="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm font-medium">{unit}</span>
          </div>
        </div>
      );
    }

    function Button({ children, onClick }) {
      return (
        <button
          onClick={onClick}
          className="w-full py-3.5 rounded-xl bg-indigo-600 text-white text-lg font-bold
                     hover:bg-indigo-700 active:scale-[0.98] transition shadow-lg shadow-indigo-200
                     focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:ring-offset-2"
        >
          {children}
        </button>
      );
    }

    function Card({ children, className = "" }) {
      return (
        <div className={`bg-white rounded-3xl shadow-xl p-6 sm:p-8 ${className}`}>
          {children}
        </div>
      );
    }

    // ========================================
    // 🧮 분류 로직 (대한비만학회 아시아인 기준)
    // ========================================
    function classify(bmi) {
      if (bmi < 18.5) {
        return { label: "저체중", text: "text-blue-600", bg: "bg-blue-50", ring: "ring-blue-200", bar: "bg-blue-500" };
      } else if (bmi < 23.0) {
        return { label: "정상", text: "text-green-600", bg: "bg-green-50", ring: "ring-green-200", bar: "bg-green-500" };
      } else if (bmi < 25.0) {
        return { label: "과체중", text: "text-yellow-600", bg: "bg-yellow-50", ring: "ring-yellow-200", bar: "bg-yellow-500" };
      } else if (bmi < 30.0) {
        return { label: "비만", text: "text-orange-600", bg: "bg-orange-50", ring: "ring-orange-200", bar: "bg-orange-500" };
      } else {
        return { label: "고도비만", text: "text-red-600", bg: "bg-red-50", ring: "ring-red-200", bar: "bg-red-500" };
      }
    }

    const RANGES = [
      { label: "저체중", range: "18.5 미만", color: "text-blue-600", dot: "bg-blue-500" },
      { label: "정상", range: "18.5 ~ 22.9", color: "text-green-600", dot: "bg-green-500" },
      { label: "과체중", range: "23.0 ~ 24.9", color: "text-yellow-600", dot: "bg-yellow-500" },
      { label: "비만", range: "25.0 ~ 29.9", color: "text-orange-600", dot: "bg-orange-500" },
      { label: "고도비만", range: "30.0 이상", color: "text-red-600", dot: "bg-red-500" },
    ];

    // ========================================
    // 📄 Page Component
    // ========================================
    function BmiCalculator() {
      const [height, setHeight] = useState("");
      const [weight, setWeight] = useState("");
      const [result, setResult] = useState(null);
      const [error, setError] = useState("");

      const handleCalculate = () => {
        const h = parseFloat(height);
        const w = parseFloat(weight);

        if (height.trim() === "" || weight.trim() === "") {
          setError("키와 몸무게를 모두 입력해 주세요.");
          setResult(null);
          return;
        }
        if (isNaN(h) || isNaN(w) || h <= 0 || w <= 0) {
          setError("0보다 큰 올바른 값을 입력해 주세요.");
          setResult(null);
          return;
        }

        setError("");
        const meters = h / 100;
        const bmi = w / (meters * meters);
        setResult({ value: bmi, info: classify(bmi) });
      };

      const handleKeyDown = (e) => {
        if (e.key === "Enter") handleCalculate();
      };

      return (
        <div className="min-h-screen flex items-center justify-center px-4 py-8">
          <div className="w-full max-w-md space-y-5">
            <header className="text-center">
              <h1 className="text-3xl font-extrabold text-slate-800">BMI 비만도 측정기</h1>
              <p className="text-slate-500 mt-1 text-sm">대한비만학회 아시아인 기준</p>
            </header>

            <Card>
              <div className="space-y-4" onKeyDown={handleKeyDown}>
                <Input
                  label="키"
                  unit="cm"
                  value={height}
                  onChange={(e) => setHeight(e.target.value)}
                  placeholder="예: 170"
                />
                <Input
                  label="몸무게"
                  unit="kg"
                  value={weight}
                  onChange={(e) => setWeight(e.target.value)}
                  placeholder="예: 65"
                />

                {error && (
                  <div className="text-sm text-red-600 bg-red-50 rounded-lg px-3 py-2" role="alert">
                    {error}
                  </div>
                )}

                <Button onClick={handleCalculate}>계산하기</Button>
              </div>
            </Card>

            {result && (
              <Card className={`ring-4 ${result.info.ring} ${result.info.bg}`}>
                <div className="text-center">
                  <p className="text-sm font-medium text-slate-500 mb-1">나의 BMI 지수</p>
                  <p className={`text-6xl font-black ${result.info.text} tracking-tight`}>
                    {result.value.toFixed(1)}
                  </p>
                  <span className={`inline-block mt-3 px-5 py-1.5 rounded-full text-white text-lg font-bold ${result.info.bar}`}>
                    {result.info.label}
                  </span>
                </div>
              </Card>
            )}

            <Card>
              <h2 className="text-sm font-bold text-slate-700 mb-3">분류 기준표</h2>
              <ul className="space-y-2">
                {RANGES.map((r) => (
                  <li key={r.label} className="flex items-center justify-between text-sm">
                    <span className="flex items-center gap-2">
                      <span className={`w-2.5 h-2.5 rounded-full ${r.dot}`}></span>
                      <span className={`font-semibold ${r.color}`}>{r.label}</span>
                    </span>
                    <span className="text-slate-500 tabular-nums">{r.range}</span>
                  </li>
                ))}
              </ul>
            </Card>

            <p className="text-center text-xs text-slate-400">
              ※ BMI는 참고용 지표이며 정확한 건강 상태는 전문가 상담을 권장합니다.
            </p>
          </div>
        </div>
      );
    }

    // ========================================
    // 🚀 Render
    // ========================================
    ReactDOM.createRoot(document.getElementById("root")).render(<BmiCalculator />);
  </script>
</body>
</html>
