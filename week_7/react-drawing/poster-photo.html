<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>망고빙수 포토 포스터 | MANGO BINGSU</title>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <!-- ⚠️ CDN 버전 고정 필수. @babel/standalone 미고정 시 8.x 로 올라가 text/babel 인라인 변환이 깨진다. -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.23.5/babel.min.js"></script>
  <style>
    /* Tailwind 유틸로 표현하기 어려운 것만 최소한으로 */
    body {
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .tracking-title { letter-spacing: -0.045em; }

    /* 사진 톤 보정 : 살짝 진하고 쨍하게 (광고 포토 느낌) */
    .photo-tone { filter: saturate(1.12) contrast(1.06) brightness(0.98); }

    /* 아주 느린 켄번즈 줌 — 정지 사진에 미세한 생동감 */
    @keyframes kenburns {
      0%   { transform: scale(1.06) translate3d(0, 0, 0); }
      100% { transform: scale(1.14) translate3d(0, -1.2%, 0); }
    }
    .kenburns { animation: kenburns 18s ease-in-out infinite alternate; }

    /* 하단 카피가 사진 위에서도 확실히 읽히도록 */
    .text-shadow-soft { text-shadow: 0 2px 18px rgba(0, 0, 0, 0.45); }

    @media (prefers-reduced-motion: reduce) {
      .kenburns { animation: none; }
    }
  </style>
</head>
<body class="bg-neutral-900 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    // ========================================
    // React Hooks
    // ========================================
    const { useState } = React;

    // ========================================
    // 🎨 팔레트 (일러스트 포스터와 동일 계열 · 시리즈 유지)
    //  ink    #2E2A26  먹색
    //  cream  #FFF4E3  크림
    //  mango  #FFD255 → #F58F2B  망고 그라데이션
    //  mint   #3E9B6D  민트
    // ========================================
    const PHOTO = "mango-photo.jpg";

    // ========================================
    // 🎨 디자인 시스템 (포토 포스터용 프리미티브)
    // ========================================

    /** 얇은 외곽선 + 자간 넓은 라벨 칩 */
    function Eyebrow({ children, className = "" }) {
      return (
        <span
          className={`inline-block px-3 py-1 text-[10px] sm:text-[11px] font-semibold uppercase
                      tracking-[0.28em] text-[#FFF4E3] border border-[#FFF4E3]/45 rounded-full
                      backdrop-blur-sm bg-black/10 ${className}`}
        >
          {children}
        </span>
      );
    }

    /** 망고 그라데이션 가격 스티커 (사진 위에 얹히는 광고 배지) */
    function PriceBadge({ price, note }) {
      return (
        <div
          className="w-[86px] h-[86px] sm:w-[104px] sm:h-[104px] rounded-full rotate-[-8deg]
                     flex flex-col items-center justify-center gap-0.5
                     bg-gradient-to-br from-[#FFD255] to-[#F58F2B]
                     ring-4 ring-[#FFF4E3]/85 shadow-xl shadow-black/25"
        >
          <span className="text-[9px] sm:text-[10px] font-bold tracking-[0.18em] text-[#2E2A26]/70 uppercase">
            {note}
          </span>
          <span className="text-base sm:text-xl font-black text-[#2E2A26] leading-none tracking-tight">
            {price}
          </span>
        </div>
      );
    }

    /** 하단 정보 블록 한 칸 */
    function InfoItem({ label, value }) {
      return (
        <div className="flex flex-col gap-1 min-w-0">
          <span className="text-[9px] sm:text-[10px] tracking-[0.22em] text-[#FFF4E3]/50 uppercase">
            {label}
          </span>
          <span className="text-xs sm:text-sm font-semibold text-[#FFF4E3] truncate">
            {value}
          </span>
        </div>
      );
    }

    /** 세로 헤어라인 (정보 블록 구분선) */
    function VRule() {
      return <div className="w-px self-stretch bg-[#FFF4E3]/20" aria-hidden="true" />;
    }

    // ========================================
    // 🖼️ 포토 레이어 : 실사 사진 + 그라데이션 마스크
    //   - 상단 : 위→아래 어두워지는 스크림 (라벨/브랜드 가독성)
    //   - 하단 : 아래→위 짙은 먹색 스크림 (헤드라인/정보 블록 가독성)
    //   - 전체 : 아주 옅은 망고 컬러 오버레이로 시리즈 톤 통일
    // ========================================
    function PhotoLayer() {
      const [loaded, setLoaded] = useState(false);

      return (
        <div className="absolute inset-0 overflow-hidden bg-[#2E2A26]">
          {/* 로딩 전 자리표시 (빈 화면 대신 크림 톤 셰이드) */}
          {!loaded && (
            <div className="absolute inset-0 animate-pulse bg-gradient-to-b from-[#FFF4E3]/20 to-[#2E2A26]" />
          )}

          <img
            src={PHOTO}
            alt="유리볼에 담긴 눈꽃빙수 위에 애플망고 큐브와 연유, 민트 잎을 올린 망고빙수 실사 사진"
            onLoad={() => setLoaded(true)}
            className={`absolute inset-0 w-full h-full object-cover object-center
                        photo-tone kenburns transition-opacity duration-700
                        ${loaded ? "opacity-100" : "opacity-0"}`}
          />

          {/* 상단 스크림 */}
          <div className="absolute inset-x-0 top-0 h-1/3 bg-gradient-to-b from-black/55 via-black/15 to-transparent" />
          {/* 하단 스크림 (헤드라인이 앉는 자리)
              흰 유리볼이 밝아서 단순 그라데이션이면 뿌옇게 뜬다 →
              바닥은 완전 불투명 먹색으로 눌러주고 위로 갈수록 빠르게 투명해지도록 스톱을 명시한다. */}
          <div
            className="absolute inset-x-0 bottom-0 h-[68%]
                       bg-[linear-gradient(to_top,#2E2A26_16%,rgba(46,42,38,0.94)_34%,rgba(46,42,38,0.62)_56%,rgba(46,42,38,0.22)_80%,transparent_100%)]"
          />
          {/* 망고 톤 통일 오버레이 */}
          <div className="absolute inset-0 bg-gradient-to-tr from-[#F58F2B]/10 via-transparent to-[#FFD255]/10 mix-blend-soft-light" />
        </div>
      );
    }

    // ========================================
    // 📄 포토 포스터
    // ========================================
    function PhotoPoster() {
      return (
        <article
          className="relative w-full max-w-[560px] aspect-[2/3] overflow-hidden
                     rounded-sm shadow-2xl shadow-black/50 select-none"
        >
          <PhotoLayer />

          {/* 얇은 내부 프레임 라인 (매거진 광고 지면 느낌) */}
          <div className="absolute inset-3 sm:inset-5 border border-[#FFF4E3]/25 pointer-events-none" />

          {/* ── 콘텐츠 레이어 ───────────────────────── */}
          <div className="relative h-full flex flex-col justify-between p-6 sm:p-10">

            {/* 상단 : 라벨 + 브랜드 */}
            <header className="flex items-start justify-between gap-3">
              <Eyebrow>Summer Limited</Eyebrow>
              <span className="pt-1 text-[10px] sm:text-[11px] tracking-[0.3em] text-[#FFF4E3]/70 uppercase text-right">
                Day On<br />Dessert
              </span>
            </header>

            {/* 하단 : 가격 배지 + 헤드라인 + 정보 블록 */}
            <div className="flex flex-col gap-5 sm:gap-7">

              {/* 가격 스티커는 헤드라인 위 오른쪽에 얹는다 */}
              <div className="flex justify-end -mb-1 sm:-mb-2">
                <PriceBadge price="12,800" note="₩ Price" />
              </div>

              {/* 헤드라인 */}
              <section className="flex flex-col gap-2 sm:gap-3">
                <p className="text-[11px] sm:text-xs tracking-[0.2em] text-[#FFD255] uppercase font-semibold">
                  Real Apple Mango
                </p>
                <h1 className="tracking-title text-[3.25rem] leading-[0.92] sm:text-7xl font-black text-[#FFF4E3] text-shadow-soft">
                  망고빙수
                </h1>
                <p className="text-[11px] sm:text-sm font-medium tracking-[0.34em] text-[#FFF4E3]/60 uppercase pl-[0.34em]">
                  Mango Bingsu
                </p>
                {/* 줄바꿈은 모바일/데스크톱 공통 — 모바일에서 br 을 숨기면
                    "…위에,제철" 처럼 쉼표 뒤가 붙어 보인다. */}
                <p className="mt-1 text-xs sm:text-sm leading-relaxed text-[#FFF4E3]/75 max-w-[34ch]">
                  눈처럼 곱게 간 우유얼음 위에,<br />
                  제철 애플망고를 아낌없이 올렸습니다.
                </p>
              </section>

              {/* 정보 블록 */}
              <section className="pt-4 sm:pt-5 border-t border-[#FFF4E3]/20">
                <div className="flex items-center gap-4 sm:gap-6">
                  <InfoItem label="Period" value="07.01 – 08.31" />
                  <VRule />
                  <InfoItem label="Store" value="전 매장" />
                  <VRule />
                  <InfoItem label="Daily" value="40그릇 한정" />
                </div>
              </section>
            </div>
          </div>
        </article>
      );
    }

    // ========================================
    // 🧩 포스터 전환 링크
    // ========================================
    function PosterNav() {
      return (
        <nav className="w-full max-w-[560px] flex items-center justify-between gap-3 text-[11px] sm:text-xs">
          <span className="tracking-[0.24em] uppercase text-[#FFF4E3]/40">
            Photo Edition
          </span>
          <a
            href="/index.html"
            className="group inline-flex items-center gap-2 px-4 py-2 rounded-full
                       border border-[#FFF4E3]/25 text-[#FFF4E3]/70
                       hover:text-[#2E2A26] hover:bg-[#FFD255] hover:border-[#FFD255]
                       transition-colors duration-200"
          >
            일러스트 포스터 보기
            <span className="transition-transform duration-200 group-hover:translate-x-0.5" aria-hidden="true">→</span>
          </a>
        </nav>
      );
    }

    // ========================================
    // 🚀 App
    // ========================================
    function App() {
      return (
        <main className="min-h-screen w-full flex flex-col items-center justify-center gap-5 sm:gap-6 p-4 sm:p-8 bg-neutral-900">
          <PhotoPoster />
          <PosterNav />
        </main>
      );
    }

    // ========================================
    // Rendering
    // ========================================
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
