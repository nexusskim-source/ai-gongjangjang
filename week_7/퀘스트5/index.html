<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Day On · 신메뉴 포스터 1080×1350</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
<style>
  :root{
    --cream:#f6efe2;
    --green:#232c24;
    --nut:#e0954a;      /* 밝은 견과 강조색 (어두운 배경 위 대비↑) */
    --nut-deep:#b07338;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ background:#2a2620; display:flex; justify-content:center; padding:24px; }

  .poster{
    width:1080px; height:1350px; position:relative; overflow:hidden;
    font-family:"Noto Sans KR",sans-serif; color:var(--cream);
    background:var(--green);
  }
  /* 신메뉴 사진 — 포스터 전면(>50%) */
  .poster .photo{
    position:absolute; inset:0; width:100%; height:100%;
    object-fit:cover; object-position:center 42%;
  }
  /* 하단 가독성용 그린 그라데이션 오버레이 */
  .poster .shade{
    position:absolute; left:0; right:0; bottom:0; height:64%;
    background:linear-gradient(to bottom,
      rgba(28,35,29,0) 0%,
      rgba(28,35,29,.35) 34%,
      rgba(26,33,27,.82) 68%,
      rgba(24,31,25,.96) 100%);
  }
  /* 상단 살짝 어둡게(뱃지 가독) */
  .poster .shade-top{
    position:absolute; left:0; right:0; top:0; height:22%;
    background:linear-gradient(to top, rgba(28,35,29,0), rgba(28,35,29,.4));
  }

  /* 상단 뱃지 */
  .top{ position:absolute; top:50px; left:60px; right:60px; z-index:2;
    display:flex; align-items:center; gap:14px; }
  .badge{
    background:var(--nut); color:#241a0d; font-weight:900;
    font-size:20px; letter-spacing:3px; padding:9px 18px; border-radius:30px;
  }
  .limited{ font-size:20px; font-weight:700; letter-spacing:5px; color:var(--cream);
    text-shadow:0 2px 8px rgba(0,0,0,.5); }

  /* 하단 카피 블록 */
  .copy{ position:absolute; left:64px; right:64px; bottom:66px; z-index:2; }
  .kicker{
    font-size:23px; font-weight:500; color:var(--nut); letter-spacing:1px;
    margin-bottom:18px; text-shadow:0 2px 10px rgba(0,0,0,.55);
  }
  .kicker .brand{ font-family:"Nanum Myeongjo",serif; font-weight:800; color:var(--cream); }
  .head{
    font-weight:900; font-size:104px; line-height:1.06; letter-spacing:-1px;
    text-shadow:0 4px 24px rgba(0,0,0,.55);
  }
  .head .hl{ color:var(--nut); }
  .name{
    font-family:"Nanum Myeongjo",serif; font-weight:800;
    font-size:46px; margin-top:26px; letter-spacing:1px;
    text-shadow:0 2px 14px rgba(0,0,0,.6);
  }
  .name .en{ font-size:22px; font-weight:700; color:#d9c8ac; letter-spacing:2px; margin-left:12px; }
  .desc{ font-size:23px; color:#e7ddc9; margin-top:12px; font-weight:400;
    text-shadow:0 2px 10px rgba(0,0,0,.55); }

  .info{ display:flex; align-items:center; gap:20px; margin-top:26px; }
  .price{ font-family:"Nanum Myeongjo",serif; font-weight:800; font-size:52px; color:var(--cream);
    text-shadow:0 2px 14px rgba(0,0,0,.6); }
  .price small{ font-size:26px; }
  .period{ background:rgba(224,149,74,.18); border:1.5px solid var(--nut);
    color:var(--nut); font-weight:700; font-size:21px; letter-spacing:1px;
    padding:9px 18px; border-radius:8px; }

  /* 매장 푸터 */
  .foot{ position:absolute; left:64px; right:64px; bottom:26px; z-index:2;
    font-size:16px; color:#cbbfa8; letter-spacing:1.5px;
    text-shadow:0 2px 8px rgba(0,0,0,.6); }
</style>
</head>
<body>
  <div class="poster">
    <img class="photo" src="신메뉴_너츠크림콜드브루.jpg" alt="너츠 크림 콜드브루" />
    <div class="shade-top"></div>
    <div class="shade"></div>

    <!-- 상단 뱃지 -->
    <div class="top">
      <span class="badge">NEW</span>
      <span class="limited">여름 시즌 한정</span>
    </div>

    <!-- 하단 카피 -->
    <div class="copy">
      <div class="kicker"><span class="brand">Day On</span> 신메뉴 · 12시간 콜드브루 + 피칸 크림</div>
      <div class="head">이 여름,<br /><span class="hl">고소하게</span> 시원하게</div>
      <div class="name">너츠 크림 콜드브루<span class="en">Nutty Cream Cold Brew</span></div>
      <div class="desc">진하게 내린 콜드브루 위, 고소한 피칸 크림 한 스쿱.</div>
      <div class="info">
        <span class="price">6,500<small>원</small></span>
        <span class="period">7–8월 한정</span>
      </div>
    </div>

    <div class="foot">서울 서대문구 연희동 · 매일 08:00–22:00 · @dayon.cafe</div>
  </div>
</body>
</html>
