<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>김수경 차장 · 명함</title>
<style>
  :root{
    --pink-900:#7a1140;
    --pink-700:#a01f52;
    --pink-500:#e0568b;
    --pink-300:#f5a3c4;
    --pink-100:#ffe4ef;
    --pink-50:#fff5fa;
    --ink:#3a0c22;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:"Pretendard","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
    background:linear-gradient(135deg,#fff0f6,#ffe0ec);
    color:var(--ink);
    min-height:100vh;
    display:flex;flex-direction:column;align-items:center;
    padding:40px 16px;gap:28px;
  }
  .toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center;}
  .toolbar h1{font-size:18px;color:var(--pink-900);font-weight:800;}
  .toolbar span{font-size:13px;color:var(--pink-700);}
  button{
    background:var(--pink-700);color:#fff;border:none;border-radius:999px;
    padding:10px 22px;font-size:14px;font-weight:700;cursor:pointer;
    box-shadow:0 4px 14px rgba(160,31,82,.3);transition:.15s;
  }
  button:hover{background:var(--pink-900);transform:translateY(-1px);}

  .cards{display:flex;gap:32px;flex-wrap:wrap;justify-content:center;}
  .card-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;}
  .card-label{font-size:12px;font-weight:700;color:var(--pink-700);letter-spacing:.08em;}

  /* 90 x 54 mm */
  .card{
    width:90mm;height:54mm;
    border-radius:4mm;overflow:hidden;position:relative;
    box-shadow:0 14px 40px rgba(122,17,64,.28);
    color:#fff;
  }

  /* ---------- FRONT ---------- */
  .front{
    background:
      radial-gradient(120% 120% at 100% 0%, var(--pink-500) 0%, var(--pink-700) 45%, var(--pink-900) 100%);
    padding:6mm 7mm;
    display:flex;flex-direction:column;justify-content:space-between;
  }
  .front::after{
    content:"";position:absolute;right:-14mm;bottom:-14mm;
    width:44mm;height:44mm;border-radius:50%;
    background:radial-gradient(circle at 30% 30%, rgba(255,255,255,.22), rgba(255,255,255,0) 70%);
  }
  .badge{
    display:inline-flex;align-items:center;gap:5px;align-self:flex-start;
    background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);
    padding:2px 9px;border-radius:999px;font-size:8.5px;font-weight:700;
    letter-spacing:.05em;backdrop-filter:blur(2px);z-index:2;
  }
  .badge .dot{width:5px;height:5px;border-radius:50%;background:#ffd6e7;box-shadow:0 0 6px #ffd6e7;}
  .front .name-row{z-index:2;}
  .front .name{font-size:30px;font-weight:800;letter-spacing:.02em;line-height:1;}
  .front .role{font-size:11px;font-weight:600;color:var(--pink-100);margin-top:3px;}
  .front .tagline{
    z-index:2;font-size:12.5px;font-weight:700;line-height:1.35;
    color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.15);
  }
  .front .tagline b{color:#ffe08a;}
  .front .contact{z-index:2;display:flex;align-items:center;gap:7px;font-size:11px;font-weight:600;}
  .front .contact .ico{
    width:15px;height:15px;border-radius:50%;background:rgba(255,255,255,.2);
    display:inline-flex;align-items:center;justify-content:center;font-size:9px;
  }

  /* ---------- BACK ---------- */
  .back{
    background:
      radial-gradient(120% 120% at 0% 100%, var(--pink-500) 0%, var(--pink-700) 50%, var(--pink-900) 100%);
    padding:6mm 7mm;
    display:flex;align-items:center;justify-content:space-between;gap:6mm;
  }
  .back::before{
    content:"";position:absolute;left:-12mm;top:-12mm;
    width:38mm;height:38mm;border-radius:50%;
    background:radial-gradient(circle at 70% 70%, rgba(255,255,255,.18), rgba(255,255,255,0) 70%);
  }
  .back-left{z-index:2;display:flex;flex-direction:column;gap:5px;max-width:44mm;}
  .back-left .slogan-sm{font-size:9px;font-weight:700;color:var(--pink-100);letter-spacing:.08em;}
  .back-left .slogan{font-size:16px;font-weight:800;line-height:1.25;}
  .back-left .slogan em{font-style:normal;color:#ffe08a;}
  .back-left .sub{font-size:9.5px;font-weight:500;color:var(--pink-100);line-height:1.4;margin-top:2px;}
  .qr-box{z-index:2;background:#fff;padding:2.5mm;border-radius:2.5mm;box-shadow:0 6px 16px rgba(0,0,0,.2);text-align:center;}
  .qr-box img{width:23mm;height:23mm;display:block;}
  .qr-box .qr-cap{font-size:7px;font-weight:700;color:var(--pink-700);margin-top:1.5mm;letter-spacing:.02em;}

  @media print{
    @page{size:auto;margin:10mm;}
    body{background:#fff;padding:0;gap:8mm;}
    .toolbar{display:none;}
    .card{box-shadow:none;border:0.2mm solid #eee;}
    .cards{gap:8mm;}
  }
</style>
</head>
<body>
  <div class="toolbar">
    <h1>김수경 차장 · 명함</h1>
    <span>90 × 54mm · 앞면 + 뒷면</span>
    <button onclick="window.print()">🖨️ 인쇄 / PDF 저장</button>
  </div>

        <div class="contact">
